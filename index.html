var fmt = function(n){
  if(!n && n!==0) return "Rp 0";
  var abs = Math.abs(Math.round(n));
  var s = abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return (n<0?"-":"")+"Rp "+s;
};
var fmtS = function(n){
  if(!n || n===0) return "Rp 0";
  var abs = Math.abs(n);
  if(abs>=1e9) return (n<0?"-":"")+"Rp "+(abs/1e9).toFixed(1).replace(".",",")+"M";
  if(abs>=1e6) return (n<0?"-":"")+"Rp "+(abs/1e6).toFixed(1).replace(".",",")+"jt";
  if(abs>=1e3) return (n<0?"-":"")+"Rp "+(abs/1e3).toFixed(0)+"rb";
  return (n<0?"-":"")+"Rp "+Math.round(abs);
};
var today = function(){ return new Date().toISOString().split("T")[0]; };
var uid = function(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); };
var monthLabel = function(d){
  try{ return new Date(d+"-01").toLocaleDateString("id-ID",{month:"long",year:"numeric"}); }
  catch(e){ return d; }
};
var shortDate = function(d){
  try{ return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short"}); }
  catch(e){ return d; }
};

function useLS(key,def){
  var init = useState(function(){
    try{ var s=localStorage.getItem(key); return s?JSON.parse(s):def; }
    catch(e){ return def; }
  });
  var val=init[0], setVal=init[1];
  var set = useCallback(function(upd){
    setVal(function(prev){
      var next = typeof upd==="function" ? upd(prev) : upd;
      try{ localStorage.setItem(key,JSON.stringify(next)); } catch(e){}
      return next;
    });
  },[key]);
  return [val,set];
}

function sbUpsert(table, data){
  var rows = Array.isArray(data)?data:[data];
  if(!rows.length) return Promise.resolve([]);
  return fetch(SB_URL+"/rest/v1/"+table,{
    method:"POST",

// ─── BAHAN INPUT WITH AUTOCOMPLETE ───────────────────────────────────────────
function BahanInput(p){
  var s1=useState(false), open=s1[0], setOpen=s1[1];
  var ref=useRef(null);
  var sugg=useMemo(function(){
    if(!p.value||p.value.length<1) return [];
    var q=p.value.toLowerCase();
    return (p.db||[]).filter(function(h){return h.nama&&h.nama.toLowerCase().indexOf(q)>=0;}).slice(0,7);
  },[p.value,p.db]);
  useEffect(function(){
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener("mousedown",h);
    return function(){document.removeEventListener("mousedown",h);};
  },[]);
  return RC("div",{ref:ref,style:{position:"relative",width:"100%"}},
    RC("input",{
      style:{width:"100%",border:"1px solid #e2e8f0",borderRadius:"6px",padding:"5px 7px",
        fontSize:".72rem",background:"white",fontFamily:"inherit"},
      placeholder:p.placeholder||"Nama bahan...",
      value:p.value,
      onChange:function(e){p.onChange(e.target.value);setOpen(true);},
      onFocus:function(){if(p.value)setOpen(true);}
    }),
    open&&sugg.length>0&&RC("div",{className:"suggest-list"},
      sugg.map(function(h){
        return RC("div",{key:h.id||h.nama,className:"suggest-item",
          onMouseDown:function(e){e.preventDefault();p.onSelect(h);setOpen(false);}},
          RC("span",{style:{fontWeight:600,color:"#1e293b"}},h.nama),
          RC("span",{style:{color:"#3b82f6",fontSize:".65rem"}},fmt(h.harga)+"/"+h.satuan)
        );
      })
    )
  );
}

// ─── SVG LINE CHART ───────────────────────────────────────────────────────────
function LineChart(p){
  // p.data = [{label, value}], p.color, p.title
  var data = p.data||[];
  if(data.length<2) return RC("div",{style:{textAlign:"center",padding:"2rem",color:"#94a3b8",fontSize:".75rem"}},
    "Minimal 2 data untuk menampilkan grafik"
  );
  var W=p.width||500, H=p.height||180;
  var pad={top:24,right:20,bottom:36,left:58};
  var w=W-pad.left-pad.right, h=H-pad.top-pad.bottom;
  var vals=data.map(function(d){return d.value;});
  var minY=Math.min.apply(null,vals), maxY=Math.max.apply(null,vals);
  var rangeY=maxY-minY||1;
  var pts=data.map(function(d,i){
    return {
      x: pad.left + (i/(data.length-1))*w,
      y: pad.top + (1-(d.value-minY)/rangeY)*h,
      label:d.label, value:d.value
    };
  });
  var pathD=pts.map(function(pt,i){return (i===0?"M":"L")+pt.x.toFixed(1)+" "+pt.y.toFixed(1);}).join(" ");
  var areaD=pathD+" L"+pts[pts.length-1].x.toFixed(1)+" "+(pad.top+h)+" L"+pad.left+" "+(pad.top+h)+" Z";
  var color=p.color||"#2563eb";
  var yTicks=[0,.25,.5,.75,1].map(function(t){return {y:pad.top+h*(1-t),val:Math.round(minY+rangeY*t)};});
  return RC("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H,overflow:"visible"}},
    // grid lines
    yTicks.map(function(t,i){
      return RC("line",{key:i,x1:pad.left,y1:t.y.toFixed(1),x2:pad.left+w,y2:t.y.toFixed(1),
        stroke:"#f1f5f9",strokeWidth:1});
    }),
    // y labels
    yTicks.map(function(t,i){
      return RC("text",{key:"yl"+i,x:pad.left-6,y:t.y+4,textAnchor:"end",
        fontSize:9,fill:"#94a3b8"},fmtS(t.val));
    }),
    // area fill
    RC("path",{d:areaD,fill:color,fillOpacity:.08}),
    // line
    RC("path",{d:pathD,fill:"none",stroke:color,strokeWidth:2,strokeLinejoin:"round",strokeLinecap:"round"}),
    // dots + x labels
    pts.map(function(pt,i){
      var showLabel = data.length<=12 || i===0 || i===data.length-1 || i%Math.ceil(data.length/8)===0;
      return RC("g",{key:i},
        RC("circle",{cx:pt.x.toFixed(1),cy:pt.y.toFixed(1),r:3.5,fill:"white",stroke:color,strokeWidth:2}),
        showLabel && RC("text",{x:pt.x.toFixed(1),y:H-6,textAnchor:"middle",fontSize:8.5,fill:"#94a3b8",
          transform:"rotate(-30,"+pt.x.toFixed(1)+","+(H-6)+")"},pt.label)
      );
    }),
    // title
    p.title && RC("text",{x:pad.left,y:14,fontSize:10,fontWeight:700,fill:"#475569"},p.title)
  );
}

// ─── SVG BAR CHART ────────────────────────────────────────────────────────────
function BarChart(p){
  var data=p.data||[];
  if(!data.length) return RC("div",{style:{textAlign:"center",padding:"2rem",color:"#94a3b8",fontSize:".75rem"}},"Belum ada data");
  var W=p.width||500, H=p.height||160;
  var pad={top:20,right:16,bottom:36,left:62};
  var w=W-pad.left-pad.right, h=H-pad.top-pad.bottom;
  var maxV=Math.max.apply(null,data.map(function(d){return d.value;}));
  if(!maxV) return null;
  var barW=Math.max(8,Math.min(36,(w/data.length)*0.65));
  var color=p.color||"#2563eb";
  return RC("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H}},
    // y axis ticks
    [0,.5,1].map(function(t,i){
      var y=pad.top+h*(1-t);
      return RC("g",{key:i},
        RC("line",{x1:pad.left,y1:y,x2:pad.left+w,y2:y,stroke:"#f1f5f9",strokeWidth:1}),
        RC("text",{x:pad.left-5,y:y+4,textAnchor:"end",fontSize:9,fill:"#94a3b8"},fmtS(maxV*t))
      );
    }),
    data.map(function(d,i){
      var bh=Math.max(2,(d.value/maxV)*h);
      var x=pad.left+(i/(data.length))*(w)+(w/data.length-barW)/2;
      var y=pad.top+h-bh;
      var cx=x+barW/2;
      return RC("g",{key:i},
        RC("rect",{x:x.toFixed(1),y:y.toFixed(1),width:barW,height:bh.toFixed(1),
          rx:3,fill:color,fillOpacity:.85}),
        RC("text",{x:cx.toFixed(1),y:H-4,textAnchor:"middle",fontSize:8.5,fill:"#94a3b8"},d.label)
      );
    })
  );
}

// ─── PAGE DASHBOARD ───────────────────────────────────────────────────────────
function PageDashboard(p){
  var bln=new Date().toISOString().slice(0,7);
  var safeB=Array.isArray(p.belanjaList)?p.belanjaList:[];
  var safeO=Array.isArray(p.operasionalList)?p.operasionalList:[];
  var blnB=safeB.filter(function(b){return b.tanggal&&b.tanggal.startsWith(bln);});
  var totalBlnIni=blnB.reduce(function(a,b){return a+(b.totalFinal||0);},0);
  var totalModal=blnB.reduce(function(a,b){return a+(b.totalSupplier||0);},0);
  var marginBln=totalBlnIni-totalModal;
  var totalOp=safeO.filter(function(o){return o.tanggal&&o.tanggal.startsWith(bln);}).reduce(function(a,o){return a+(o.jumlah||0);},0);
  var budgetHarian=blnB.reduce(function(a,b){return a+((b.porsiKecil||0)*8000+(b.porsiBesar||0)*10000);},0);

  // monthly bar chart data (last 6 months)
  var monthlyData=(function(){
    var map={};
    safeB.forEach(function(b){
      if(!b.tanggal) return;
      var m=b.tanggal.slice(0,7);
      map[m]=(map[m]||0)+(b.totalFinal||0);
    });
    var months=Object.keys(map).sort().slice(-6);
    return months.map(function(m){
      return {label:new Date(m+"-01").toLocaleDateString("id-ID",{month:"short",year:"2-digit"}),value:map[m]};
    });
  })();

  // top bahan
  var bahanMap={};
  blnB.forEach(function(b){(b.items||[]).forEach(function(it){
    if(!it.nama) return;
    if(!bahanMap[it.nama]) bahanMap[it.nama]={nama:it.nama,total:0,count:0};
    bahanMap[it.nama].total+=(it.qty||0)*(it.hargaSupplier||0);
    bahanMap[it.nama].count++;
  });});
  var topBahan=Object.values(bahanMap).sort(function(a,b){return b.total-a.total;}).slice(0,5);

  // recent
  var recent=safeB.slice().sort(function(a,b){return (b.tanggal||"").localeCompare(a.tanggal||"");}).slice(0,6);
  var perSppg=p.sppgList.map(function(s){
    var bl=safeB.filter(function(b){return b.sppgId===s.id;});
    var bBln=bl.filter(function(b){return b.tanggal&&b.tanggal.startsWith(bln);});
    return {id:s.id,nama:s.nama,blnTotal:bBln.reduce(function(a,b){return a+(b.totalFinal||0);},0),total:bl.reduce(function(a,b){return a+(b.totalFinal||0);},0),count:bl.length};
  });
  var cards=[
    {l:"Belanja Bulan Ini",v:fmtS(totalBlnIni),c:"#2563eb",bg:"#eff6ff",bd:"#bfdbfe",icon:"🛒"},
    {l:"Budget Porsi",v:fmtS(budgetHarian),c:"#7c3aed",bg:"#f5f3ff",bd:"#ddd6fe",icon:"🍱"},
    {l:"Operasional",v:fmtS(totalOp),c:"#ea580c",bg:"#fff7ed",bd:"#fed7aa",icon:"⚙️"},
    {l:"Selisih Harga",v:fmtS(marginBln),c:marginBln>=0?"#059669":"#dc2626",bg:marginBln>=0?"#f0fdf4":"#fef2f2",bd:marginBln>=0?"#bbf7d0":"#fecaca",icon:marginBln>=0?"📈":"📉"},
  ];
  return RC("div",{style:{display:"flex",flexDirection:"column",gap:".875rem"}},
    RC(PageHeader,{title:"Dashboard",sub:"Rekap "+monthLabel(bln),
      action:RC(Btn,{onClick:function(){p.setModal("sppg");},sm:true},"+ SPPG")}),
    RC("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:".5rem"}},
      cards.map(function(x){
        return RC("div",{key:x.l,style:{background:x.bg,border:"1px solid "+x.bd,borderRadius:".75rem",padding:".75rem"}},
          RC("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}},
            RC("p",{style:{fontSize:".62rem",fontWeight:700,color:"#64748b",margin:0,textTransform:"uppercase",letterSpacing:".04em"}},x.l),
            RC("span",null,x.icon)
          ),
          RC("p",{style:{fontSize:"1.05rem",fontWeight:800,color:x.c,margin:"4px 0 0"}},x.v)
        );
      })
    ),
    monthlyData.length>0&&RC(Card,null,
      RC("p",{style:{fontSize:".75rem",fontWeight:700,color:"#475569",margin:"0 0 .5rem"}},"Total Belanja 6 Bulan Terakhir"),
      RC(BarChart,{data:monthlyData,color:"#2563eb",height:150})
    ),
    p.sppgList.length>0&&RC(Card,null,
      RC("p",{style:{fontSize:".75rem",fontWeight:700,color:"#475569",margin:"0 0 .625rem"}},"Rekap per SPPG — "+monthLabel(bln)),
      RC("div",{style:{overflowX:"auto"}},
        RC("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:".7rem",minWidth:"260px"}},
          RC("thead",null,RC("tr",null,["SPPG","Bln Ini","Total","Trx"].map(function(h,i){return RC(TH,{key:h,right:i>0},h);}))),
          RC("tbody",null,perSppg.map(function(s){
            return RC("tr",{key:s.id},
              RC(TD,null,RC("b",{style:{color:"#1e293b"}},s.nama)),
              RC(TD,{style:{textAlign:"right",color:"#2563eb",fontWeight:700}},fmtS(s.blnTotal)),
              RC(TD,{style:{textAlign:"right",color:"#64748b"}},fmtS(s.total)),
              RC(TD,{style:{textAlign:"right",color:"#94a3b8"}},s.count+"x")
            );
          }))
        )
      )
    ),
    topBahan.length>0&&RC(Card,null,
      RC("p",{style:{fontSize:".75rem",fontWeight:700,color:"#475569",margin:"0 0 .625rem"}},"Top Bahan Bulan Ini"),
      RC("div",{style:{overflowX:"auto"}},
        RC("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:".7rem"}},
          RC("thead",null,RC("tr",null,["Bahan","Total","Frekuensi"].map(function(h,i){return RC(TH,{key:h,right:i>0},h);}))),
          RC("tbody",null,topBahan.map(function(b,i){
            return RC("tr",{key:i},
              RC(TD,null,RC("b",null,b.nama)),
              RC(TD,{style:{textAlign:"right",color:"#059669",fontWeight:700}},fmtS(b.total)),
              RC(TD,{style:{textAlign:"right",color:"#94a3b8"}},b.count+"x")
            );
          }))
        )
      )
    ),
    recent.length>0&&RC(Card,null,
      RC("p",{style:{fontSize:".75rem",fontWeight:700,color:"#475569",margin:"0 0 .625rem"}},"Belanja Terakhir"),
      RC("div",{style:{overflowX:"auto"}},
        RC("table",{style:{width:"100%",borderCollapse:"collapse",fontSize:".7rem",minWidth:"260px"}},
          RC("thead",null,RC("tr",null,["Tanggal","Judul","SPPG","Total"].map(function(h,i){return RC(TH,{key:h,right:i===3},h);}))),
          RC("tbody",null,recent.map(function(b){
            var sp=p.sppgList.find(function(x){return x.id===b.sppgId;});
            return RC("tr",{key:b.id},
              RC(TD,{style:{color:"#94a3b8",whiteSpace:"nowrap"}},shortDate(b.tanggal)),
              RC(TD,{style:{maxWidth:"120px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:600}},b.judul||"(tanpa judul)"),
              RC(TD,{style:{color:"#94a3b8",whiteSpace:"nowrap"}},sp?sp.nama:"—"),
              RC(TD,{style:{textAlign:"right",fontWeight:700,color:"#2563eb",whiteSpace:"nowrap"}},fmt(b.totalFinal||0))
            );
          }))
        )
      )
    ),
    safeB.length===0&&RC(EmptyState,{icon:"🛒",title:"Belum ada data belanja",sub:"Mulai input di tab Belanja"})
  );
}

function PageBelanja(p){
  function emptyRow(){return {id:uid(),nama:"",qty:0,satuan:"",hargaSupplier:0,hargaFinal:0};}
  var initRows=(function(){var r=[];for(var i=0;i<8;i++)r.push(emptyRow());return r;})();

  var s1=useState("input"),view=s1[0],setView=s1[1];
  var s2=useState(p.sppgList[0]?p.sppgList[0].id:""),selSppg=s2[0],setSelSppg=s2[1];
  var s3=useState(""),judul=s3[0],setJudul=s3[1];
  var s4=useState(today()),tgl=s4[0],setTgl=s4[1];
  var s5=useState(0),pk=s5[0],setPk=s5[1];
  var s6=useState(0),pb=s6[0],setPb=s6[1];
  var s7=useState(initRows),rows=s7[0],setRowsRaw=s7[1];
  var s8=useState(null),editEntry=s8[0],setEditEntry=s8[1];
  var s9=useState(""),filterSppg=s9[0],setFilterSppg=s9[1];
  var s10=useState(""),filterBulan=s10[0],setFilterBulan=s10[1];
  var s11=useState(""),searchQ=s11[0],setSearchQ=s11[1];
  var s12=useState(null),detailId=s12[0],setDetailId=s12[1];
  var s13=useState(false),saving=s13[0],setSaving=s13[1];

  var safeRows=Array.isArray(rows)?rows:initRows;
  function setRows(fn){setRowsRaw(function(prev){var p2=Array.isArray(prev)?prev:initRows;return fn(p2);});}

  var activeRows=safeRows.filter(function(r){return r.nama&&r.qty>0;});
  var totalSupplier=activeRows.reduce(function(a,r){return a+r.qty*(r.hargaSupplier||0);},0);
  var totalFinal=activeRows.reduce(function(a,r){return a+r.qty*(r.hargaFinal||0);},0);

  function upd(id,field,val){
    setRows(function(prev){return prev.map(function(r){
      if(r.id!==id) return r;
      var v=(field==="qty"||field==="hargaSupplier"||field==="hargaFinal")?parseFloat(val)||0:val;
      return Object.assign({},r,{[field]:v});
    });});
  }
  function selSug(id,h){
    setRows(function(prev){return prev.map(function(r){
      if(r.id!==id) return r;
      return Object.assign({},r,{nama:h.nama,satuan:h.satuan,hargaSupplier:h.harga,hargaFinal:h.harga});
    });});
  }

  function simpan(){
    if(!selSppg) return alert("Pilih SPPG terlebih dahulu!");
    if(!judul) return alert("Isi judul belanja!");
    if(!activeRows.length) return alert("Minimal 1 bahan diisi!");
    setSaving(true);
    var entry={id:uid(),sppgId:selSppg,judul:judul,tanggal:tgl,
      porsiKecil:parseInt(pk)||0,porsiBesar:parseInt(pb)||0,
      items:activeRows,totalSupplier:totalSupplier,totalFinal:totalFinal,createdAt:new Date().toISOString()};
    p.setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).concat([entry]);});
    if(p.dbStatus==="online"){
      sbUpsert("transaksi",[belanjaToTrx(entry)]).catch(function(){});
    }
    // reset
    var r2=[];for(var i=0;i<8;i++)r2.push(emptyRow());
    setRows(function(){return r2;});setJudul("");setPk(0);setPb(0);
    setSaving(false);
    alert("✅ Belanja berhasil disimpan!");
  }

  function hapusBelanja(id){
    if(!window.confirm("Hapus data belanja ini?")) return;
    p.setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(b){return b.id!==id;});});
    if(p.dbStatus==="online") sbDelete("transaksi",id).catch(function(){});
  }
  function saveEdit(updated){
    p.setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).map(function(b){return b.id===updated.id?updated:b;});});
    if(p.dbStatus==="online") sbUpsert("transaksi",[belanjaToTrx(updated)]).catch(function(){});
    setEditEntry(null);

    if(searchQ){

    }),

      RC(Card,null,
        RC("p",{style:{fontSize:".75rem",fontWeight:700,color:"#475569",margin:"0 0 .625rem"}},"Info Belanja"),

function ModalEditBelanja(p){
  var entry=p.entry||{};
  var initItems=(Array.isArray(entry.items)?entry.items:[]).map(function(it){
    return {id:it.id||uid(),nama:it.nama||"",qty:it.qty||0,satuan:it.satuan||"",hargaSupplier:it.hargaSupplier||0,hargaFinal:it.hargaFinal||0};
  });
  while(initItems.length<4) initItems.push({id:uid(),nama:"",qty:0,satuan:"",hargaSupplier:0,hargaFinal:0});
  var r1=useState(entry.judul||""),judul=r1[0],setJudul=r1[1];
  var r2=useState(entry.tanggal||today()),tgl=r2[0],setTgl=r2[1];

  var r4=useState(entry.porsiBesar||0),pb=r4[0],setPb=r4[1];
  var r5=useState(initItems),rows=r5[0],setRows=r5[1];
  var r6=useState(entry.sppgId||""),sppgId=r6[0],setSppgId=r6[1];

    setRows(function(prev){return prev.map(function(r){
      if(r.id!==id) return r;
      var v=(field==="qty"||field==="hargaSupplier"||field==="hargaFinal")?parseFloat(val)||0:val;
      return Object.assign({},r,{[field]:v});
    });});

            RC("input",{style:is,value:judul,onChange:function(e){setJudul(e.target.value);}})

function PageHarga(p){
  // p.hargaList = current prices [{id,nama,satuan,harga,tanggal}]
  // p.hargaHistory = all historical [{id,nama,satuan,harga,tanggal}]
  var s1=useState(""),search=s1[0],setSearch=s1[1];
  var s2=useState(null),editItem=s2[0],setEditItem=s2[1];
  var s3=useState(null),chartItem=s3[0],setChartItem=s3[1];
  var s4=useState(false),showAdd=s4[0],setShowAdd=s4[1];
  var s5=useState({nama:"",satuan:"",harga:""}),newItem=s5[0],setNewItem=s5[1];

  var safeH=Array.isArray(p.hargaList)?p.hargaList:[];
  var safeHist=Array.isArray(p.hargaHistory)?p.hargaHistory:[];

  // group history by name for chart
  var chartData=useMemo(function(){
    if(!chartItem) return [];
    return safeHist
      .filter(function(h){return h.nama===chartItem;})
      .sort(function(a,b){return (a.tanggal||"").localeCompare(b.tanggal||"");})
      .map(function(h){return {label:shortDate(h.tanggal),value:h.harga||0};});
  },[chartItem,safeHist]);

  var filtered=safeH.filter(function(h){
    if(!search) return true;
    return (h.nama||"").toLowerCase().indexOf(search.toLowerCase())>=0;
  });

  function saveHarga(item,newHarga,newSatuan){
    // insert new history record (new id, today's date)
    var histRecord={id:uid(),nama:item.nama,satuan:newSatuan||item.satuan,harga:newHarga,tanggal:today()};
    // update current price (upsert by original id)
    var updated=Object.assign({},item,{harga:newHarga,satuan:newSatuan||item.satuan,tanggal:today()});
    p.setHargaList(function(prev){
      return (Array.isArray(prev)?prev:[]).map(function(h){return h.id===item.id?updated:h;});
    });
    p.setHargaHistory(function(prev){return (Array.isArray(prev)?prev:[]).concat([histRecord]);});
    if(p.dbStatus==="online"){
      sbUpsert("harga_survei",[hargaToSB(updated)]).catch(function(){});
      sbInsert("harga_survei",[hargaToSB(histRecord)]).catch(function(){});
    }
    setEditItem(null);
  }

  function addHarga(){
    if(!newItem.nama||!newItem.harga) return alert("Nama dan harga wajib diisi!");
    var item={id:uid(),nama:newItem.nama,satuan:newItem.satuan||"kg",harga:parseFloat(newItem.harga)||0,tanggal:today()};
    var histRec=Object.assign({},item,{id:uid()});
    p.setHargaList(function(prev){return (Array.isArray(prev)?prev:[]).concat([item]);});
    p.setHargaHistory(function(prev){return (Array.isArray(prev)?prev:[]).concat([histRec]);});
    if(p.dbStatus==="online"){
      sbInsert("harga_survei",[hargaToSB(item),hargaToSB(histRec)]).catch(function(){});
    }
    setNewItem({nama:"",satuan:"",harga:""});
    setShowAdd(false);
  }

  function delHarga(id){
    if(!window.confirm("Hapus data harga ini?")) return;
    p.setHargaList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(h){return h.id!==id;});});
    if(p.dbStatus==="online") sbDelete("harga_survei",id).catch(function(){});
  }

  var is={width:"100%",border:"1px solid #e2e8f0",borderRadius:".5rem",padding:".45rem .75rem",fontSize:".8rem",fontFamily:"inherit"};

  return RC("div",{style:{display:"flex",flexDirection:"column",gap:".875rem"}},
    RC(PageHeader,{title:"Harga Bahan",sub:"Referensi & Riwayat Harga",
      action:RC(Btn,{onClick:function(){setShowAdd(true);},sm:true},"+ Tambah")}),

    // search + chart selector
    RC(Card,null,
      RC("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:".5rem"}},
        RC("div",null,
          RC("label",{style:{fontSize:".68rem",fontWeight:600,color:"#64748b",display:"block",marginBottom:"3px"}},"Cari Bahan"),
          RC("input",{style:is,placeholder:"Ketik nama bahan...",value:search,onChange:function(e){setSearch(e.target.value);}})
        ),
        RC("div",null,
          RC("label",{style:{fontSize:".68rem",fontWeight:600,color:"#64748b",display:"block",marginBottom:"3px"}},"Grafik Tren Harga"),
          RC("select",{style:is,value:chartItem||"",onChange:function(e){setChartItem(e.target.value||null);}},
            RC("option",{value:""},"— Pilih bahan untuk grafik —"),
            safeH.map(function(h){return RC("option",{key:h.id,value:h.nama},h.nama);})
          )
        )

    ),

    // chart
    chartItem&&RC(Card,null,
      RC("p",{style:{fontSize:".75rem",fontWeight:700,color:"#475569",margin:"0 0 .5rem"}},"Tren Harga: "+chartItem),
      chartData.length<2
        ?RC("p",{style:{fontSize:".75rem",color:"#94a3b8",textAlign:"center",padding:"1rem 0"}},"Belum ada riwayat perubahan harga untuk bahan ini")

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  var s1=useState("dashboard"),tab=s1[0],setTab=s1[1];
  var s2=useLS("mbg_sppg",[]),sppgList=s2[0],setSppgList=s2[1];
  var s3=useLS("mbg_belanja_v2",[]),belanjaList=s3[0],setBelanjaList=s3[1];
  var s4=useLS("mbg_operasional",[]),operasionalList=s4[0],setOperasionalList=s4[1];
  var s5=useLS("mbg_hargadb",HARGA0),hargaList=s5[0],setHargaList=s5[1];
  var s6=useLS("mbg_harga_history",[]),hargaHistory=s6[0],setHargaHistory=s6[1];
  var s7=useState(null),modal=s7[0],setModal=s7[1];
  var s8=useState(false),collapsed=s8[0],setCollapsed=s8[1];
  var s9=useState("connecting"),dbStatus=s9[0],setDbStatus=s9[1];
  var s10=useState(false),loading=s10[0],setLoading=s10[1];
  var s11=useState(""),syncMsg=s11[0],setSyncMsg=s11[1];
  var s12=useState(false),showSbModal=s12[0],setShowSbModal=s12[1];

  var safeSppg=Array.isArray(sppgList)?sppgList:[];

  // ── Auto-connect on first load ──
  useEffect(function(){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();},8000);
    setLoading(true);
    fetch(SB_URL+"/rest/v1/sppg?select=id&limit=1",{headers:SBH,signal:ctrl.signal})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status);
        return Promise.all([
          sbGet("sppg"),
          sbGet("transaksi","komponen=eq.bahan_baku"),
          sbGet("transaksi","komponen=eq.operasional"),
          sbGet("harga_survei")
        ]);
      })
      .then(function(res){
        clearTimeout(timer);
        if(Array.isArray(res[0])&&res[0].length>0) setSppgList(res[0].map(sbToSppg));
        if(Array.isArray(res[1])&&res[1].length>0) setBelanjaList(res[1].map(trxToBelanja));
        if(Array.isArray(res[2])&&res[2].length>0) setOperasionalList(res[2].map(trxToOp));
        if(Array.isArray(res[3])&&res[3].length>0){
          var allHarga=res[3].map(sbToHarga);
          // current = latest per nama
          var latestMap={};
          allHarga.forEach(function(h){
            if(!latestMap[h.nama]||h.tanggal>latestMap[h.nama].tanggal) latestMap[h.nama]=h;
          });
          setHargaList(Object.values(latestMap));
          setHargaHistory(allHarga);
        }
        setDbStatus("online");
      })
      .catch(function(){ setDbStatus("local"); })
      .finally(function(){ setLoading(false); clearTimeout(timer); });
    return function(){ clearTimeout(timer); ctrl.abort(); };
  },[]);

  // ── Auto-refresh every 30s ──
  useEffect(function(){
    if(dbStatus!=="online") return;
    var iv=setInterval(function(){
      Promise.all([
        sbGet("sppg"),
        sbGet("transaksi","komponen=eq.bahan_baku"),
        sbGet("transaksi","komponen=eq.operasional"),
        sbGet("harga_survei")
      ]).then(function(res){
        if(Array.isArray(res[0])&&res[0].length>0) setSppgList(res[0].map(sbToSppg));
        if(Array.isArray(res[1])&&res[1].length>0) setBelanjaList(res[1].map(trxToBelanja));
        if(Array.isArray(res[2])&&res[2].length>0) setOperasionalList(res[2].map(trxToOp));
        if(Array.isArray(res[3])&&res[3].length>0){
          var allHarga=res[3].map(sbToHarga);
          var latestMap={};
          allHarga.forEach(function(h){if(!latestMap[h.nama]||h.tanggal>latestMap[h.nama].tanggal)latestMap[h.nama]=h;});
          setHargaList(Object.values(latestMap));
          setHargaHistory(allHarga);
        }
      }).catch(function(){});
    },30000);
    return function(){ clearInterval(iv); };
  },[dbStatus]);

  // ── Supabase Realtime subscription ──
  useEffect(function(){
    if(dbStatus!=="online" && dbStatus!=="realtime") return;
    var client=getSBClient();
    if(!client) return;

    var channel=client.channel("mbg-live-"+Date.now())
      // ── transaksi (belanja + operasional) ──
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"transaksi"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        if(row.komponen==="bahan_baku"){
          setBelanjaList(function(prev){
            var list=Array.isArray(prev)?prev:[];
            if(list.some(function(b){return b.id===row.id;})) return list; // já existe
            return list.concat([trxToBelanja(row)]);
          });
        } else if(row.komponen==="operasional"){
          setOperasionalList(function(prev){
            var list=Array.isArray(prev)?prev:[];
            if(list.some(function(o){return o.id===row.id;})) return list;
            return list.concat([trxToOp(row)]);
          });
        }
      })
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"transaksi"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        if(row.komponen==="bahan_baku"){
          setBelanjaList(function(prev){
            return (Array.isArray(prev)?prev:[]).map(function(b){return b.id===row.id?trxToBelanja(row):b;});
          });
        } else if(row.komponen==="operasional"){
          setOperasionalList(function(prev){
            return (Array.isArray(prev)?prev:[]).map(function(o){return o.id===row.id?trxToOp(row):o;});
          });
        }
      })
      .on("postgres_changes",{event:"DELETE",schema:"public",table:"transaksi"},function(payload){
        var id=payload.old&&payload.old.id; if(!id) return;
        setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(b){return b.id!==id;});});
        setOperasionalList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(o){return o.id!==id;});});
      })
      // ── sppg ──
      .on("postgres_changes",{event:"*",schema:"public",table:"sppg"},function(){
        sbGet("sppg").then(function(rows){
          if(Array.isArray(rows)&&rows.length>0) setSppgList(rows.map(sbToSppg));
        }).catch(function(){});
      })
      // ── harga_survei ──
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"harga_survei"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        var hItem=sbToHarga(row);
        setHargaHistory(function(prev){
          var list=Array.isArray(prev)?prev:[];
          if(list.some(function(h){return h.id===row.id;})) return list;
          return list.concat([hItem]);
        });
        setHargaList(function(prev){
          var list=Array.isArray(prev)?prev:[];
          var ex=list.find(function(h){return h.nama===hItem.nama;});
          if(!ex) return list.concat([hItem]);
          if(hItem.tanggal>=ex.tanggal) return list.map(function(h){return h.nama===hItem.nama?hItem:h;});
          return list;
        });
      })
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"harga_survei"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        var hItem=sbToHarga(row);
        setHargaHistory(function(prev){
          return (Array.isArray(prev)?prev:[]).map(function(h){return h.id===row.id?hItem:h;});
        });
        setHargaList(function(prev){
          return (Array.isArray(prev)?prev:[]).map(function(h){return h.id===row.id?hItem:h;});
        });
      })
      .subscribe(function(status,err){
        if(status==="SUBSCRIBED"){
          setDbStatus("realtime");
        } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
          setDbStatus("online"); // fallback ke polling
          console.warn("Realtime channel error:",err);
        }
      });

    return function(){ client.removeChannel(channel); };
  },[dbStatus]);

  function syncFromSB(){
    setSyncMsg("Mengambil data dari Supabase...");
    Promise.all([sbGet("sppg"),sbGet("transaksi","komponen=eq.bahan_baku"),sbGet("transaksi","komponen=eq.operasional"),sbGet("harga_survei")])
      .then(function(res){
        if(Array.isArray(res[0])&&res[0].length>0) setSppgList(res[0].map(sbToSppg));
        if(Array.isArray(res[1])&&res[1].length>0) setBelanjaList(res[1].map(trxToBelanja));
        if(Array.isArray(res[2])&&res[2].length>0) setOperasionalList(res[2].map(trxToOp));
        if(Array.isArray(res[3])&&res[3].length>0){
          var allHarga=res[3].map(sbToHarga);
          var latestMap={};
          allHarga.forEach(function(h){if(!latestMap[h.nama]||h.tanggal>latestMap[h.nama].tanggal)latestMap[h.nama]=h;});
          setHargaList(Object.values(latestMap));
          setHargaHistory(allHarga);
        }
        setSyncMsg("✅ Berhasil disinkronkan!");
        setDbStatus("online");
        setTimeout(function(){setSyncMsg("");},2500);
      })
      .catch(function(e){ setSyncMsg("❌ Gagal: "+e.message); setDbStatus("local"); });
  }
  function pushToSB(){
    setSyncMsg("Mengirim ke Supabase...");
    var sppgRows=safeSppg.map(sppgToSB);
    var trxB=(Array.isArray(belanjaList)?belanjaList:[]).map(belanjaToTrx);
    var trxO=(Array.isArray(operasionalList)?operasionalList:[]).map(opToTrx);
    var hRows=(Array.isArray(hargaList)?hargaList:[]).map(hargaToSB);
    Promise.all([
      sppgRows.length?sbUpsert("sppg",sppgRows):Promise.resolve(),
      trxB.length?sbUpsert("transaksi",trxB):Promise.resolve(),
      trxO.length?sbUpsert("transaksi",trxO):Promise.resolve(),
      hRows.length?sbUpsert("harga_survei",hRows):Promise.resolve()
    ]).then(function(){
      setSyncMsg("✅ Berhasil dikirim!");
      setTimeout(function(){setSyncMsg("");},2500);
    }).catch(function(e){ setSyncMsg("❌ Push gagal: "+e.message); });
  }

  function addSppg(s){
    setSppgList(function(prev){return (Array.isArray(prev)?prev:[]).concat([s]);});
    if(dbStatus==="online") sbUpsert("sppg",[sppgToSB(s)]).catch(function(){});
  }

  var NAV=[
    {id:"dashboard",icon:"🏠",label:"Home"},
    {id:"belanja",icon:"🛒",label:"Belanja"},
    {id:"operasional",icon:"⚙️",label:"Ops"},
    {id:"harga",icon:"💹",label:"Harga"},
    {id:"nota",icon:"📋",label:"Nota"},
  ];

  function renderPage(){
    if(tab==="dashboard") return RC(PageDashboard,{sppgList:safeSppg,belanjaList:belanjaList,operasionalList:operasionalList,setModal:setModal});
    if(tab==="belanja") return RC(PageBelanja,{sppgList:safeSppg,belanjaList:belanjaList,setBelanjaList:setBelanjaList,hargaDB:hargaList,dbStatus:dbStatus});
    if(tab==="operasional") return RC(PageOperasional,{sppgList:safeSppg,operasionalList:operasionalList,setOperasionalList:setOperasionalList,dbStatus:dbStatus});
    if(tab==="harga") return RC(PageHarga,{hargaList:hargaList,setHargaList:setHargaList,hargaHistory:hargaHistory,setHargaHistory:setHargaHistory,dbStatus:dbStatus});
    if(tab==="nota") return RC(PageNota,{belanjaList:belanjaList,sppgList:safeSppg});
    return null;
  }

  var stC={online:"#4ade80",realtime:"#34d399",connecting:"#60a5fa",error:"#f87171",local:"#facc15",idle:"#94a3b8"};
  var stL={online:"Live",realtime:"⚡ Realtime",connecting:"...",error:"Error",local:"Lokal",idle:"Lokal"};

  return RC("div",{className:"app-shell"},
    // TOPBAR
    RC("div",{className:"topbar"},
      RC("div",{style:{display:"flex",alignItems:"center",gap:".75rem"}},
        RC("button",{onClick:function(){setCollapsed(function(c){return !c;});},style:{background:"rgba(255,255,255,.15)",border:"none",borderRadius:".5rem",width:"2rem",height:"2rem",cursor:"pointer",color:"white",fontSize:"1.1rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
          collapsed?"☰":"✕"
        ),
        RC("div",{style:{width:"2rem",height:"2rem",background:"rgba(255,255,255,.2)",borderRadius:".5rem",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.1rem"}},"🍱"),
        RC("div",null,
          RC("p",{style:{fontWeight:"bold",fontSize:".875rem",margin:0}},"PantauBelanjaMBG"),
          RC("p",{style:{fontSize:".65rem",opacity:.75,margin:0}},"SPPG Citeureup")
        )
      ),
      RC("div",{style:{display:"flex",alignItems:"center",gap:".5rem"}},
        RC("span",{style:{fontSize:".7rem",opacity:.8}},safeSppg.length+" SPPG"),
        RC("button",{onClick:function(){setShowSbModal(true);},style:{background:"rgba(255,255,255,.15)",border:"none",borderRadius:"20px",padding:"3px 10px",cursor:"pointer",fontSize:".7rem",color:"white",display:"flex",alignItems:"center",gap:"4px"}},
          RC("span",{className:"status-dot",style:{background:stC[dbStatus]||"#94a3b8"}}),
          stL[dbStatus]||"—"
        )
      )
    ),

    // Loading overlay
    loading&&RC("div",{style:{position:"fixed",inset:0,background:"rgba(255,255,255,.92)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:"1rem"}},
      RC("div",{style:{width:"2.5rem",height:"2.5rem",border:"4px solid #3b82f6",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 1s linear infinite"}}),
      RC("p",{style:{fontSize:".875rem",color:"#4b5563",fontWeight:500,margin:0}},"Memuat data..."),
      RC("p",{style:{fontSize:".75rem",color:"#9ca3af",margin:0}},"Menghubungkan ke Supabase")
    ),

    // CONTENT
    RC("div",{className:"content-area"+(collapsed?" collapsed":"")},
      RC("aside",{className:"sidebar"},
        NAV.map(function(n){
          return RC("button",{key:n.id,className:"sidebar-btn"+(tab===n.id?" active":""),onClick:function(){setTab(n.id);},title:n.label},
            RC("span",{className:"si"},n.icon),
            RC("span",{className:"sidebar-label"},n.label)
          );
        }),
        RC("div",{className:"sidebar-note",style:{marginTop:"auto",padding:".625rem",background:"#f8fafc",borderRadius:".5rem",fontSize:".65rem",color:"#94a3b8",lineHeight:1.5}},
          dbStatus==="realtime"?"⚡ Realtime aktif — data sync otomatis":
          dbStatus==="online"?"☁️ Tersambung ke Supabase":"💾 Data lokal. Klik status di topbar."
        )
      ),
      RC("main",{className:"page-content"},renderPage())
    ),

    // BOTTOM NAV (mobile)
    RC("nav",{className:"bottom-nav",style:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"900px",background:"white",borderTop:"1px solid #f3f4f6",display:"flex",zIndex:100,boxShadow:"0 -1px 3px rgba(0,0,0,.1)"}},
      NAV.map(function(n){
        return RC("button",{key:n.id,onClick:function(){setTab(n.id);},style:{flex:1,padding:".55rem 0",display:"flex",flexDirection:"column",alignItems:"center",gap:".125rem",border:"none",background:"none",cursor:"pointer",color:tab===n.id?"#2563eb":"#9ca3af",minWidth:0}},
          RC("span",{style:{fontSize:"clamp(.9rem,2.5vw,1.1rem)",lineHeight:1}},n.icon),
          RC("span",{style:{fontSize:"clamp(.48rem,1.6vw,.65rem)",fontWeight:500,whiteSpace:"nowrap"}},n.label)
        );
      })
    ),

    // MODALS
    modal==="sppg"&&RC(ModalSPPG,{onSave:function(s){addSppg(s);setModal(null);},onClose:function(){setModal(null);}}),

    // SUPABASE MODAL
    showSbModal&&RC("div",{className:"sb-modal",onClick:function(e){if(e.target===e.currentTarget)setShowSbModal(false);}},
      RC("div",{className:"sb-inner"},
        RC("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}},
          RC("p",{style:{fontWeight:700,fontSize:".95rem",margin:0}},"Koneksi Database"),
          RC("button",{onClick:function(){setShowSbModal(false);},style:{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:"1.5rem",lineHeight:1}},"×")
        ),
        RC("div",{style:{background:"#f8fafc",borderRadius:".625rem",padding:".875rem",marginBottom:"1rem"}},
          RC("div",{style:{display:"flex",alignItems:"center",gap:".625rem",marginBottom:".375rem"}},
            RC("span",{className:"status-dot",style:{width:"10px",height:"10px",background:stC[dbStatus]||"#94a3b8"}}),
            RC("span",{style:{fontWeight:700,fontSize:".85rem",color:"#1e293b"}},
              dbStatus==="realtime"?"⚡ Realtime Aktif":
              dbStatus==="online"?"Terhubung ke Supabase":
              dbStatus==="connecting"?"Menghubungkan...":"Koneksi gagal / offline"
            )
          ),
          RC("p",{style:{fontSize:".7rem",color:"#64748b",margin:0}},SB_URL.replace("https://","")),
          RC("p",{style:{fontSize:".68rem",color:"#94a3b8",margin:"4px 0 0"}},
            dbStatus==="realtime"
              ?"⚡ Realtime WebSocket aktif — perubahan data langsung terlihat di semua perangkat tanpa refresh."
              :"Data tersimpan di cloud & lokal. Sync otomatis setiap 30 detik (polling). Realtime akan aktif otomatis saat koneksi tersedia."
          )
        ),
        syncMsg&&RC("div",{style:{padding:"8px 12px",borderRadius:".625rem",background:syncMsg.indexOf("❌")>=0?"#fef2f2":"#f0fdf4",color:syncMsg.indexOf("❌")>=0?"#dc2626":"#059669",fontSize:".78rem",fontWeight:600,marginBottom:".75rem"}},syncMsg),
        RC("div",{style:{display:"flex",gap:".5rem"}},
          RC("button",{onClick:syncFromSB,style:{flex:1,background:"#059669",color:"white",border:"none",borderRadius:".5rem",padding:".65rem",fontSize:".82rem",fontWeight:600,cursor:"pointer"}},"⬇ Ambil dari Cloud"),
          RC("button",{onClick:pushToSB,style:{flex:1,background:"#7c3aed",color:"white",border:"none",borderRadius:".5rem",padding:".65rem",fontSize:".82rem",fontWeight:600,cursor:"pointer"}},"⬆ Kirim ke Cloud")
        ),
        RC("p",{style:{fontSize:".65rem",color:"#94a3b8",marginTop:".625rem",textAlign:"center"}},"Ambil: tarik data terbaru. Kirim: dorong data lokal ke cloud.")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(RC(App,null));
</script>

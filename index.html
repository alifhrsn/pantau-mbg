function useLS(key,def){
  const [val,setVal]=useState(function(){
    try{var s=localStorage.getItem(key);return s?JSON.parse(s):def;}catch(e){return def;}
  });
  const set=useCallback(function(upd){
    setVal(function(prev){
      var next=typeof upd==="function"?upd(prev):upd;
      try{localStorage.setItem(key,JSON.stringify(next));}catch(e){}
      return next;
    });
  },[key]);
  return [val,set];
}

  var h=hari||26;
  var bb=(pk||0)*8000+(pb||0)*10000;
  var pm=(pk||0)+(pb||0);

  return {bb:bb,op:op,ins:ins,total:bb+op+ins,periode:(bb+op+ins)*h,pm:pm,hari:h};
}

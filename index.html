function useLS(key,def){
  const [val,setVal]=useState(function(){
    try{var s=localStorage.getItem(key);return s?JSON.parse(s):def;}catch(e){return def;}
  });
  const set=useCallback(function(upd){
    setVal(function(prev){
      var next=typeof upd==="function"?upd(prev):upd;
      try{localStorage.setItem(key,JSON.stringify(next));}catch(e){}
      return next;
    });
  },[key]);
  return [val,set];
}

function BahanInput({value,onChange,hargaDB,onSelectSuggestion,placeholder}){

    if(!value||value.length<1)return[];
    var q=value.toLowerCase();
    return (hargaDB||[]).filter(function(h){return h.nama&&h.nama.toLowerCase().includes(q);}).slice(0,7);
  },[value,hargaDB]);

  useEffect(function(){
    function handler(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener("mousedown",handler);
    return function(){document.removeEventListener("mousedown",handler);};
  },[]);

  return React.createElement("div",{ref:ref,style:{position:"relative",width:"100%"}},
    React.createElement("input",{
      style:{width:"100%",border:"1px solid transparent",borderRadius:"6px",padding:"5px 7px",fontSize:"0.72rem",background:"transparent"},

function PageBelanja({sppgList,belanjaList,setBelanjaList,hargaDB,setHargaDB,setModal}){
  var emptyRow=function(){return {id:uid(),nama:"",qty:0,satuan:"pcs",hargaSupplier:0,hargaFinal:0};};
  var initRows=(function(){var r=[];for(var i=0;i<8;i++)r.push(emptyRow());return r;})();
  var [selSppg,setSelSppg]=useState(sppgList[0]?sppgList[0].id:"");
  var [judul,setJudul]=useState("");
  var [tanggal,setTanggal]=useState(today());
  var [porsiKecil,setPorsiKecil]=useState(0);
  var [porsiBesar,setPorsiBesar]=useState(0);
  var [rows,setRowsRaw]=useLS("mbg_belanja_draft",initRows);
  var safeRows=Array.isArray(rows)?rows:initRows;
  function setRows(fn){setRowsRaw(function(prev){var p=Array.isArray(prev)?prev:initRows;return fn(p);});}
  var [globalMargin,setGlobalMargin]=useState(0);
  var [view,setView]=useState("input");
  var [filterSppg,setFilterSppg]=useState("semua");
  var [openId,setOpenId]=useState(null);

  var totalSupplier=safeRows.reduce(function(a,r){return a+r.qty*r.hargaSupplier;},0);
  var totalFinal=safeRows.reduce(function(a,r){return a+r.qty*r.hargaFinal;},0);
  var totalMargin=totalFinal-totalSupplier;
  var marginPct=totalSupplier>0?((totalMargin/totalSupplier)*100).toFixed(1):0;
  var budgetHarian=(porsiKecil||0)*8000+(porsiBesar||0)*10000;

  function updateRow(id,field,val){
    setRows(function(p){return p.map(function(r){
      if(r.id!==id)return r;
      var v=(field==="qty"||field==="hargaSupplier"||field==="hargaFinal")?parseFloat(val)||0:val;
      return Object.assign({},r,{[field]:v});
    });});
  }
  function selectSuggestion(rowId,h){
    setRows(function(p){return p.map(function(r){
      if(r.id!==rowId)return r;
      var hf=globalMargin>0?Math.round(h.harga*(1+globalMargin/100)):h.harga;
      return Object.assign({},r,{nama:h.nama,satuan:h.satuan,hargaSupplier:h.harga,hargaFinal:hf});
    });});
  }
  function applyMargin(){setRows(function(p){return p.map(function(r){return Object.assign({},r,{hargaFinal:Math.round(r.hargaSupplier*(1+globalMargin/100))});});});}
  function addRow(){setRows(function(p){return p.concat([emptyRow()]);});}
  function delRow(id){setRows(function(p){return p.length>1?p.filter(function(r){return r.id!==id;}):p;});}

  function simpan(){
    if(!selSppg)return alert("Pilih SPPG dulu!");

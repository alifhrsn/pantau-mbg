if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      // Cek update di background
      reg.addEventListener('updatefound',function(){
        var newWorker=reg.installing;
        newWorker.addEventListener('statechange',function(){
          if(newWorker.state==='installed'&&navigator.serviceWorker.controller){
            // Ada versi baru — tampilkan toast
            var c=document.getElementById('mbg-toasts');
            if(c){var el=document.createElement('div');el.className='toast t-info';
              el.innerHTML='🔄 Versi baru tersedia — <b style="cursor:pointer;text-decoration:underline" onclick="location.reload()">Muat Ulang</b>';
              c.appendChild(el);}
          }
        });
      });
    }).catch(function(err){console.warn('SW gagal registrasi:',err);});
  });
}

function showToast(msg,type,dur){
  var c=document.getElementById("mbg-toasts");
  if(!c)return;
  var el=document.createElement("div");
  el.className="toast t-"+(type||"info");

// ─── UTILS ────────────────────────────────────────────────────────────────────
var fmt = function(n){
  if(!n && n!==0) return "Rp 0";
  var abs = Math.abs(Math.round(n));
  var s = abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
  return (n<0?"-":"")+"Rp "+s;
};
var fmtS = function(n){
  if(!n || n===0) return "Rp 0";
  var abs = Math.abs(n);
  if(abs>=1e9) return (n<0?"-":"")+"Rp "+(abs/1e9).toFixed(1).replace(".",",")+"M";
  if(abs>=1e6) return (n<0?"-":"")+"Rp "+(abs/1e6).toFixed(1).replace(".",",")+"jt";
  if(abs>=1e3) return (n<0?"-":"")+"Rp "+(abs/1e3).toFixed(0)+"rb";
  return (n<0?"-":"")+"Rp "+Math.round(abs);
};

  catch(e){ return d; }
};
var shortDate = function(d){
  try{ return new Date(d).toLocaleDateString("id-ID",{day:"numeric",month:"short"}); }
  catch(e){ return d; }
};

function useLS(key,def){
  var init = useState(function(){
    try{ var s=localStorage.getItem(key); return s?JSON.parse(s):def; }
    catch(e){ return def; }
  });
  var val=init[0], setVal=init[1];
  var set = useCallback(function(upd){
    setVal(function(prev){
      var next = typeof upd==="function" ? upd(prev) : upd;
      try{ localStorage.setItem(key,JSON.stringify(next)); } catch(e){}
      return next;
    });
  },[key]);
  return [val,set];
}

// ─── NOMOR NOTA OTOMATIS ──────────────────────────────────────────────────────
// Format: MBG/YYYY/MM/NNN — counter per bulan disimpan di localStorage
function getNextNotaNo(){
  var now=new Date();
  var yr=now.getFullYear();
  var mo=String(now.getMonth()+1).padStart(2,'0');
  var key='mbg_nota_seq_'+yr+'_'+mo;
  var seq=(parseInt(localStorage.getItem(key))||0)+1;
  localStorage.setItem(key,String(seq));
  return 'MBG/'+yr+'/'+mo+'/'+String(seq).padStart(3,'0');
}

// ─── INTEGRASI HARGA: gabung harga_survei + data belanja ─────────────────────
// Mengembalikan {history:[], current:[]} dengan data terlengkap dari kedua sumber
function buildHargaData(belanjaArr, hargaSurveiArr){
  // Key selalu menyertakan satuan agar harga per-pcs dan per-kg tidak saling timpa
  var histMap = {};

  // 1. Dari harga_survei (sumber eksplisit — prioritas lebih tinggi)
  (hargaSurveiArr||[]).forEach(function(h){
    if(!h.nama || !(h.harga>0)) return;
    var tgl = (h.tanggal||"").slice(0,10);
    var sat = (h.satuan||"").toLowerCase().trim();
    var key = h.nama+"__"+sat+"__"+tgl;
    histMap[key+"__"+h.id] = {id:h.id, nama:h.nama, satuan:h.satuan||"", harga:h.harga, tanggal:tgl};
  });

  // 2. Dari data belanja — satu record per nama+satuan+tanggal (tidak duplikat)
  (belanjaArr||[]).forEach(function(b){
    var tgl = (b.tanggal||"").slice(0,10);
    if(!tgl) return;
    (b.items||[]).forEach(function(it){
      if(!it.nama || !(it.hargaFinal>0)) return;
      var sat = (it.satuan||"").toLowerCase().trim();
      var key = it.nama+"__"+sat+"__"+tgl+"__belanja";
      // Hanya tambah jika belum ada record harga_survei untuk nama+satuan+tanggal ini
      var hasSurvei = Object.keys(histMap).some(function(k){
        return k.startsWith(it.nama+"__"+sat+"__"+tgl+"__") && !k.endsWith("__belanja");
      });
      if(!hasSurvei && !histMap[key]){
        var safeNama=(it.nama||"").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,10);
        histMap[key] = {id:"blj_"+tgl.replace(/-/g,"")+"_"+safeNama+"_"+sat.slice(0,4),
          nama:it.nama, satuan:it.satuan||"", harga:it.hargaFinal, tanggal:tgl};
      }
    });
  });

  var allHist = Object.values(histMap);

  // current = harga terbaru per nama+satuan (BEDA satuan = entri terpisah)
  var latestMap = {};
  allHist.forEach(function(h){
    var mapKey = h.nama+"__"+(h.satuan||"").toLowerCase().trim();
    if(!latestMap[mapKey] || (h.tanggal||"") > (latestMap[mapKey].tanggal||"")){
      latestMap[mapKey] = h;
    }
  });

  // Tambahkan item dari HARGA0 yang belum ada di data manapun
  HARGA0.forEach(function(h0){
    var mapKey = h0.nama+"__"+(h0.satuan||"").toLowerCase().trim();
    if(!latestMap[mapKey]){
      latestMap[mapKey] = {id:h0.id, nama:h0.nama, satuan:h0.satuan, harga:h0.harga, tanggal:""};
    }
  });

  return {history: allHist, current: Object.values(latestMap)};
}

// ─── SVG LINE CHART ───────────────────────────────────────────────────────────
function LineChart(p){
  // p.data = [{label, value}], p.color, p.title
  var data = p.data||[];
  if(data.length<2) return RC("div",{style:{textAlign:"center",padding:"2rem",color:"#94a3b8",fontSize:".75rem"}},
    "Minimal 2 data untuk menampilkan grafik"
  );
  var W=p.width||500, H=p.height||180;
  var pad={top:24,right:20,bottom:36,left:58};
  var w=W-pad.left-pad.right, h=H-pad.top-pad.bottom;
  var vals=data.map(function(d){return d.value;});
  var minY=Math.min.apply(null,vals), maxY=Math.max.apply(null,vals);
  var rangeY=maxY-minY||1;
  var pts=data.map(function(d,i){
    return {
      x: pad.left + (i/(data.length-1))*w,
      y: pad.top + (1-(d.value-minY)/rangeY)*h,
      label:d.label, value:d.value
    };
  });
  var pathD=pts.map(function(pt,i){return (i===0?"M":"L")+pt.x.toFixed(1)+" "+pt.y.toFixed(1);}).join(" ");
  var areaD=pathD+" L"+pts[pts.length-1].x.toFixed(1)+" "+(pad.top+h)+" L"+pad.left+" "+(pad.top+h)+" Z";
  var color=p.color||"#2563eb";
  var yTicks=[0,.25,.5,.75,1].map(function(t){return {y:pad.top+h*(1-t),val:Math.round(minY+rangeY*t)};});
  return RC("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H,overflow:"visible"}},
    // grid lines
    yTicks.map(function(t,i){
      return RC("line",{key:i,x1:pad.left,y1:t.y.toFixed(1),x2:pad.left+w,y2:t.y.toFixed(1),
        stroke:"#f1f5f9",strokeWidth:1});
    }),
    // y labels
    yTicks.map(function(t,i){
      return RC("text",{key:"yl"+i,x:pad.left-6,y:t.y+4,textAnchor:"end",
        fontSize:9,fill:"#94a3b8"},fmtS(t.val));
    }),
    // area fill
    RC("path",{d:areaD,fill:color,fillOpacity:.08}),
    // line
    RC("path",{d:pathD,fill:"none",stroke:color,strokeWidth:2,strokeLinejoin:"round",strokeLinecap:"round"}),
    // dots + x labels
    pts.map(function(pt,i){
      var showLabel = data.length<=12 || i===0 || i===data.length-1 || i%Math.ceil(data.length/8)===0;
      return RC("g",{key:i},
        RC("circle",{cx:pt.x.toFixed(1),cy:pt.y.toFixed(1),r:3.5,fill:"white",stroke:color,strokeWidth:2}),
        showLabel && RC("text",{x:pt.x.toFixed(1),y:H-6,textAnchor:"middle",fontSize:8.5,fill:"#94a3b8",
          transform:"rotate(-30,"+pt.x.toFixed(1)+","+(H-6)+")"},pt.label)
      );
    }),
    // title
    p.title && RC("text",{x:pad.left,y:14,fontSize:10,fontWeight:700,fill:"#475569"},p.title)
  );
}

// ─── SVG BAR CHART ────────────────────────────────────────────────────────────
function BarChart(p){
  var data=p.data||[];
  if(!data.length) return RC("div",{style:{textAlign:"center",padding:"2rem",color:"#94a3b8",fontSize:".75rem"}},"Belum ada data");
  var W=p.width||500, H=p.height||160;
  var pad={top:20,right:16,bottom:36,left:62};
  var w=W-pad.left-pad.right, h=H-pad.top-pad.bottom;
  var maxV=Math.max.apply(null,data.map(function(d){return d.value;}));
  if(!maxV) return null;
  var barW=Math.max(8,Math.min(36,(w/data.length)*0.65));
  var color=p.color||"#2563eb";
  return RC("svg",{viewBox:"0 0 "+W+" "+H,style:{width:"100%",height:H}},
    // y axis ticks
    [0,.5,1].map(function(t,i){
      var y=pad.top+h*(1-t);
      return RC("g",{key:i},
        RC("line",{x1:pad.left,y1:y,x2:pad.left+w,y2:y,stroke:"#f1f5f9",strokeWidth:1}),
        RC("text",{x:pad.left-5,y:y+4,textAnchor:"end",fontSize:9,fill:"#94a3b8"},fmtS(maxV*t))
      );
    }),
    data.map(function(d,i){
      var bh=Math.max(2,(d.value/maxV)*h);
      var x=pad.left+(i/(data.length))*(w)+(w/data.length-barW)/2;
      var y=pad.top+h-bh;
      var cx=x+barW/2;
      return RC("g",{key:i},
        RC("rect",{x:x.toFixed(1),y:y.toFixed(1),width:barW,height:bh.toFixed(1),
          rx:3,fill:color,fillOpacity:.85}),
        RC("text",{x:cx.toFixed(1),y:H-4,textAnchor:"middle",fontSize:8.5,fill:"#94a3b8"},d.label)
      );
    })
  );
}

// ─── HELPER PERIODE MBG ──────────────────────────────────────────────────────
// Periode: Senin s/d Sabtu pekan depannya (13 hari aktif)
// Siklus : 14 hari (13 hari periode + 1 hari Minggu jeda antar periode)
// Contoh  : Periode 1 = 25 Mei (Sen) – 6 Jun (Sab) 2026
var MBG_EPOCH="2026-05-25";   // Senin pertama
var MBG_PERIOD_DAYS=13;       // Durasi periode: Sen–Sab pekan depannya
var MBG_CYCLE_DAYS=14;        // Siklus total: 13 hari + 1 Minggu jeda

function getPeriodInfo(periodNum){
  var epochMs=new Date(MBG_EPOCH).getTime();
  var startMs=epochMs+(periodNum-1)*MBG_CYCLE_DAYS*86400000;
  var endMs=startMs+(MBG_PERIOD_DAYS-1)*86400000;
  var fmt2=function(d){return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});};
  var toISO=function(ms){return new Date(ms).toISOString().slice(0,10);};
  var startDate=new Date(startMs);
  var endDate=new Date(endMs);
  // Verifikasi: harus Senin s/d Sabtu
  var hariMulai=["Min","Sen","Sel","Rab","Kam","Jum","Sab"][startDate.getDay()];
  var hariAkhir=["Min","Sen","Sel","Rab","Kam","Jum","Sab"][endDate.getDay()];
  return {
    num:periodNum,
    start:toISO(startMs),
    end:toISO(endMs),
    label:"Periode "+periodNum,
    rangeLabel:hariMulai+", "+fmt2(startDate)+" – "+hariAkhir+", "+fmt2(endDate)
  };
}
function getCurrentPeriodNum(){
  var epochMs=new Date(MBG_EPOCH).getTime();
  var nowMs=new Date(today()).getTime();
  var diffDays=Math.floor((nowMs-epochMs)/86400000);
  if(diffDays<0) return 1;
  var cycle=Math.floor(diffDays/MBG_CYCLE_DAYS);
  var dayInCycle=diffDays%MBG_CYCLE_DAYS;
  // Hari Minggu (dayInCycle===13) = jeda antar periode → tampilkan periode sebelumnya
  return dayInCycle>=MBG_PERIOD_DAYS ? cycle+1 : cycle+1;
}
function isMingguJeda(){
  var epochMs=new Date(MBG_EPOCH).getTime();
  var nowMs=new Date(today()).getTime();
  var diffDays=Math.floor((nowMs-epochMs)/86400000);
  return diffDays>=0 && diffDays%MBG_CYCLE_DAYS===MBG_PERIOD_DAYS;
}

// ─── PAGE DASHBOARD ───────────────────────────────────────────────────────────
function PageDashboard(p){

  // ── Navigasi periode ──

  var isJeda=isMingguJeda(); // Hari Minggu antara dua periode
  var sp=useState(curPeriodNum),selPeriod=sp[0],setSelPeriod=sp[1];
  var periodInfo=getPeriodInfo(selPeriod);

  // ── State pemilih laporan (harian / periode / bulanan) ──
  var slm=useState(false),showLapMenu=slm[0],setShowLapMenu=slm[1];

  var periodeB=safeB.filter(function(b){
    return b.tanggal&&b.tanggal>=periodInfo.start&&b.tanggal<=periodInfo.end;
  });
  var totalPeriode=periodeB.reduce(function(a,b){return a+(b.totalFinal||0);},0);
  var budgetPeriode=periodeB.reduce(function(a,b){return a+((b.porsiKecil||0)*8000+(b.porsiBesar||0)*10000);},0);
  var sisaPeriode=budgetPeriode-totalPeriode;
  var porsiKecilPeriode=periodeB.reduce(function(a,b){return a+(b.porsiKecil||0);},0);
  var porsiBesarPeriode=periodeB.reduce(function(a,b){return a+(b.porsiBesar||0);},0);
  var itemStatusPeriode={belum_dipesan:0,dipesan:0,dibayar:0,dikirim:0,sampai:0,dibatalkan:0};
  periodeB.forEach(function(b){(b.items||[]).forEach(function(it){
    var st=it.status||"belum_dipesan";itemStatusPeriode[st]=(itemStatusPeriode[st]||0)+1;
  });});

  // Bulan ini (untuk summary cards)
  var blnB=safeB.filter(function(b){return b.tanggal&&b.tanggal.startsWith(bln);});
  var totalBlnIni=blnB.reduce(function(a,b){return a+(b.totalFinal||0);},0);
  var budgetHarian=blnB.reduce(function(a,b){return a+((b.porsiKecil||0)*8000+(b.porsiBesar||0)*10000);},0);
  var sisaBudget=budgetHarian-totalBlnIni;

  // ── Hitung status bahan (item-level) untuk seluruh belanja bulan ini ──
  var itemStatusBln={belum_dipesan:0,dipesan:0,dibayar:0,dikirim:0,sampai:0,dibatalkan:0};
  blnB.forEach(function(b){
    (b.items||[]).forEach(function(it){
      var st=it.status||"belum_dipesan";
      itemStatusBln[st]=(itemStatusBln[st]||0)+1;
    });
  });
  var totalItemAktif=(itemStatusBln.belum_dipesan||0)+(itemStatusBln.dipesan||0)+(itemStatusBln.dibayar||0)+(itemStatusBln.dikirim||0);

  // ── Belanja terakhir ditambah/diedit (1 entry) ──
  var lastBelanja=safeB.slice().sort(function(a,b){
    var ta=a.createdAt||a.tanggal||"";
    var tb=b.createdAt||b.tanggal||"";
    return tb.localeCompare(ta);
  })[0]||null;

  // ── Pesanan aktif terbaru (3 entry, ada item yang belum sampai) — item-level ──
  var pesananAktif=safeB.filter(function(b){
    return (b.items||[]).some(function(it){
      var st=it.status||"belum_dipesan";
      return st!=="sampai"&&st!=="dibatalkan";
    });
  }).sort(function(a,b){
    var ta=a.createdAt||a.tanggal||"";
    var tb=b.createdAt||b.tanggal||"";
    return tb.localeCompare(ta);
  }).slice(0,3);

  // ── Fluktuasi harga: bandingkan harga terbaru vs sebelumnya per komoditas ──
  var fluktuasi=useMemo(function(){
    var byNama={};
    safeHist.forEach(function(h){
      if(!h.nama||!(h.harga>0)) return;
      if(!byNama[h.nama]) byNama[h.nama]=[];
      byNama[h.nama].push(h);
    });
    var result=[];
    Object.keys(byNama).forEach(function(nama){
      var sorted=byNama[nama].slice().sort(function(a,b){return (a.tanggal||"").localeCompare(b.tanggal||"");});
      if(sorted.length<2) return;
      var latest=sorted[sorted.length-1];
      var prev=sorted[sorted.length-2];
      var selisih=latest.harga-prev.harga;
      var pct=prev.harga>0?Math.round((selisih/prev.harga)*100):0;
      if(selisih===0) return;
      result.push({nama:nama,satuan:latest.satuan||"",hargaLama:prev.harga,hargaBaru:latest.harga,
        selisih:selisih,pct:pct,tanggal:latest.tanggal});
    });
    return result.sort(function(a,b){return Math.abs(b.pct)-Math.abs(a.pct);}).slice(0,5);
  },[safeHist]);

  // Bahan aktif (belum sampai) dalam periode terpilih
  var totalItemAktifPeriode=(itemStatusPeriode.belum_dipesan||0)+(itemStatusPeriode.dipesan||0)+(itemStatusPeriode.dibayar||0)+(itemStatusPeriode.dikirim||0);

  // Pilih sumber data ringkasan sesuai toggle

     v:(sumSisa>=0?"+":"")+fmtS(Math.abs(sumSisa)),

     bg:sumBudget>0?(sumSisa>=0?"#f0fdf4":"#fef2f2"):"#f8fafc",
     bd:sumBudget>0?(sumSisa>=0?"#bbf7d0":"#fecaca"):"#e2e8f0",
     icon:sumBudget>0?(sumSisa>=0?"✅":"⚠️"):"—"},
  ];

  function SectionLabel(props){
    return RC("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:".5rem"}},
      RC("p",{style:{fontSize:".75rem",fontWeight:800,color:"#1e293b",margin:0}},props.title),
      props.sub&&RC("span",{style:{fontSize:".62rem",color:"#94a3b8"}},props.sub)
    );
  }

  // Fungsi generik: cetak laporan untuk kumpulan belanja (dataB) dgn judul & subjudul tertentu
  function buildLaporan(dataB,subtitle){
    var totalData=dataB.reduce(function(a,b){return a+(b.totalFinal||0);},0);
    var budgetData=dataB.reduce(function(a,b){return a+((b.porsiKecil||0)*8000+(b.porsiBesar||0)*10000);},0);

      var st=it.status||"belum_dipesan";statusData[st]=(statusData[st]||0)+1;
    });});
    var rows="";
    dataB.slice().sort(function(a,b){return (a.tanggal||"").localeCompare(b.tanggal||"");}).forEach(function(b){
      var sp=(p.sppgList||[]).find(function(x){return x.id===b.sppgId;});
      rows+='<tr><td>'+shortDate(b.tanggal)+'</td><td>'+(sp?sp.nama:"")+'</td><td>'+b.judul+'</td><td style="text-align:right">'+fmt(b.totalFinal)+'</td></tr>';
    });
    var bahanAgg={};

      bahanAgg[it.nama].total+=(it.qty||0)*(it.hargaFinal||0);

    var bahanRows="";
    Object.keys(bahanAgg).sort().forEach(function(nama){
      var x=bahanAgg[nama];
      bahanRows+='<tr><td>'+nama+'</td><td style="text-align:center">'+x.qty+' '+x.satuan+'</td><td style="text-align:right">'+fmt(x.total)+'</td></tr>';
    });
    var win=window.open("","_blank","width=800,height=1000");

  // Simpan harga terbaru dari bahan ke hargaList + hargaHistory + Supabase
  function updateHargaDB(rows, tanggal){
    rows.forEach(function(row){
      if(!row.nama || !(row.hargaFinal>0)) return;
      // Cocokkan nama + satuan agar harga per-pcs dan per-kg tetap terpisah
      var sat=(row.satuan||"").toLowerCase().trim();
      var ex=(p.hargaDB||[]).find(function(h){return h.nama===row.nama&&(h.satuan||"").toLowerCase().trim()===sat;})
          ||(p.hargaDB||[]).find(function(h){return h.nama===row.nama&&!h.satuan;});
      var updatedItem={
        id:ex?ex.id:uid(),
        nama:row.nama,
        satuan:row.satuan||(ex?ex.satuan:"")||"",
        harga:row.hargaFinal,
        tanggal:tanggal
      };
      // 1. Update hargaList (harga saat ini)
      if(p.setHargaList){
        p.setHargaList(function(prev){
          var list=Array.isArray(prev)?prev:[];
          if(!list.find(function(h){return h.nama===row.nama;})) return list.concat([updatedItem]);
          return list.map(function(h){return h.nama===row.nama?updatedItem:h;});
        });
      }
      // 2. Update hargaHistory (untuk grafik tren) — satu record per nama+tanggal
      if(p.setHargaHistory){
        p.setHargaHistory(function(prev){
          var list=Array.isArray(prev)?prev:[];
          var sameDay=list.find(function(h){return h.nama===row.nama&&(h.tanggal||"").slice(0,10)===tanggal;});
          if(sameDay){
            return list.map(function(h){
              return (h.nama===row.nama&&(h.tanggal||"").slice(0,10)===tanggal)
                ? Object.assign({},h,{harga:row.hargaFinal,satuan:updatedItem.satuan}) : h;
            });
          }
          return list.concat([{id:uid(),nama:row.nama,satuan:updatedItem.satuan,harga:row.hargaFinal,tanggal:tanggal}]);
        });
      }
      // 3. Push ke Supabase supaya tidak tertimpa saat auto-refresh
      if(dbOK(p.dbStatus)){
        sbUpsert("harga_survei",[hargaToSB(updatedItem)]).catch(function(e){console.warn("updateHargaDB upsert:",e);});
      }
    });
  }

  function simpan(){
    if(!selSppg){showToast("Pilih SPPG terlebih dahulu!","error");return;}
    if(!judul){showToast("Isi judul belanja!","error");return;}
    if(!activeRows.length){showToast("Minimal 1 bahan diisi!","error");return;}
    var zeroQty=activeRows.filter(function(r){return !(r.qty>0);});
    var zeroPrice=activeRows.filter(function(r){return !(r.hargaFinal>0);});
    if(zeroQty.length>0){showToast("Qty tidak boleh 0 atau negatif: "+zeroQty.map(function(r){return r.nama;}).join(", "),"error");return;}
    if(zeroPrice.length>0&&!window.confirm(zeroPrice.length+" bahan harga 0. Tetap simpan?")){return;}
    if(!editId){
      var isDup=safeB.some(function(b){
        return b.sppgId===selSppg&&b.tanggal===tgl&&(b.judul||"").toLowerCase()===(judul||"").toLowerCase();
      });
      if(isDup&&!window.confirm("Sudah ada belanja '"+judul+"' di tanggal ini. Tetap simpan?"))return;
    }
    setSaving(true);
    var cloudOK=dbOK(p.dbStatus);
    if(editId){
      // ── MODE EDIT: update entry yang sudah ada ──
      var existing=safeB.find(function(b){return b.id===editId;});
      if(existing){
        // Merge activeRows dengan status tracking dari item original (cocokkan by id lalu by nama)
        var mergedItems=activeRows.map(function(row){
          var orig=(existing.items||[]).find(function(ei){return ei.id===row.id;})
                || (existing.items||[]).find(function(ei){return ei.nama===row.nama;});
          return Object.assign({},row,{
            id:row.id||(orig?orig.id:uid()),
            status:orig?(orig.status||"belum_dipesan"):(row.status||"belum_dipesan"),
            statusLog:orig?(orig.statusLog||[]):(row.statusLog||[])
          });
        });
        var updated=Object.assign({},existing,{sppgId:selSppg,judul:judul,tanggal:tgl,
          porsiKecil:parseInt(pk)||0,porsiBesar:parseInt(pb)||0,
          items:mergedItems,totalSupplier:totalSupplier,totalFinal:totalFinal,
          status:existing.status||"belum_dipesan",
          statusLog:existing.statusLog||[],
          notaNo:existing.notaNo||""});
        p.setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).map(function(b){return b.id===editId?updated:b;});});
        if(cloudOK) sbUpsert("transaksi",[belanjaToTrx(updated)]).catch(function(e){console.warn(e);});
      }
      updateHargaDB(activeRows, tgl);
      setEditId(null);
      setSaving(false);
      showToast("Perubahan berhasil disimpan!","success");
    } else {
      // ── MODE BARU: tambah entry baru ──
      // Pastikan setiap item baru punya status awal
      var entryItems=activeRows.map(function(row){
        return Object.assign({},row,{status:row.status||"belum_dipesan",statusLog:row.statusLog||[]});
      });
      var entry={id:uid(),sppgId:selSppg,judul:judul,tanggal:tgl,
        porsiKecil:parseInt(pk)||0,porsiBesar:parseInt(pb)||0,
        items:entryItems,totalSupplier:totalSupplier,totalFinal:totalFinal,createdAt:new Date().toISOString()};
      p.setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).concat([entry]);});
      if(cloudOK) sbUpsert("transaksi",[belanjaToTrx(entry)]).catch(function(e){console.warn(e);});
      updateHargaDB(activeRows, tgl);
      setSaving(false);
      // ⚠️ Form TIDAK di-reset — user bisa langsung tambah lagi atau edit
      showToast(cloudOK?"Berhasil disimpan ke Supabase!":"Disimpan lokal (offline)",cloudOK?"success":"info");
    }
  }

  function hapusBelanja(id){
    if(!window.confirm("Hapus data belanja ini?")) return;
    p.setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(b){return b.id!==id;});});
    if(dbOK(p.dbStatus)) sbDelete("transaksi",id).catch(function(){});
    if(editId===id) setEditId(null);
  }

// ─── PAGE HARGA ───────────────────────────────────────────────────────────────
function PageHarga(p){
  // p.hargaList = current prices [{id,nama,satuan,harga,tanggal}]
  // p.hargaHistory = all historical [{id,nama,satuan,harga,tanggal}]
  var s1=useState(""),search=s1[0],setSearch=s1[1];
  var s2=useState(null),editItem=s2[0],setEditItem=s2[1];
  var s3=useState(null),chartItem=s3[0],setChartItem=s3[1];
  var s4=useState(false),showAdd=s4[0],setShowAdd=s4[1];
  var s5=useState({nama:"",satuan:"",harga:""}),newItem=s5[0],setNewItem=s5[1];

  var safeH=Array.isArray(p.hargaList)?p.hargaList:[];
  var safeHist=Array.isArray(p.hargaHistory)?p.hargaHistory:[];

  // ── Deteksi anomali harga: bandingkan vs ~30 hari lalu, threshold 15% ──
  var ANOMALI_THRESHOLD=15;
  var anomali=useMemo(function(){
    var result={};
    safeH.forEach(function(h){
      var sat=(h.satuan||"").toLowerCase().trim();
      // Filter history berdasarkan nama + satuan agar tidak campur satuan berbeda
      var hist=safeHist.filter(function(r){
        return r.nama===h.nama && (r.satuan||"").toLowerCase().trim()===sat;
      }).sort(function(a,b){return (b.tanggal||"").localeCompare(a.tanggal||"");});
      if(hist.length<2) return;
      var latest=hist[0];
      var cutoff=new Date();cutoff.setDate(cutoff.getDate()-30);
      var cutoffStr=cutoff.toISOString().slice(0,10);
      var older=hist.find(function(r){return (r.tanggal||"")<=cutoffStr;})||hist[hist.length-1];
      if(older.id===latest.id||!(older.harga>0)) return;
      var pct=Math.round(((latest.harga-older.harga)/older.harga)*100);
      if(Math.abs(pct)>=ANOMALI_THRESHOLD){
        var key=h.nama+"__"+sat;
        result[key]={nama:h.nama,satuan:h.satuan,pct:pct,dari:older.harga,ke:latest.harga,tglDari:older.tanggal};
      }
    });
    return result;
  },[safeH,safeHist]);

  var anomaliCount=Object.keys(anomali).length;

  // group history by name for chart
  // chartItem format: "nama__satuan" agar bisa bedakan satuan berbeda
  var chartData=useMemo(function(){
    if(!chartItem) return [];
    var parts=chartItem.split("__");
    var cNama=parts[0], cSat=parts[1]||"";
    return safeHist
      .filter(function(h){
        return h.nama===cNama && (h.satuan||"").toLowerCase().trim()===(cSat||"").toLowerCase().trim();
      })
      .sort(function(a,b){return (a.tanggal||"").localeCompare(b.tanggal||"");})
      .map(function(h){return {label:shortDate(h.tanggal),value:h.harga||0};});
  },[chartItem,safeHist]);

  var filtered=safeH.filter(function(h){
    if(!search) return true;
    return (h.nama||"").toLowerCase().indexOf(search.toLowerCase())>=0;
  });

  function saveHarga(item,newHarga,newSatuan){
    // insert new history record (new id, today's date)
    var histRecord={id:uid(),nama:item.nama,satuan:newSatuan||item.satuan,harga:newHarga,tanggal:today()};
    // update current price (upsert by original id)
    var updated=Object.assign({},item,{harga:newHarga,satuan:newSatuan||item.satuan,tanggal:today()});
    p.setHargaList(function(prev){
      return (Array.isArray(prev)?prev:[]).map(function(h){return h.id===item.id?updated:h;});
    });
    p.setHargaHistory(function(prev){return (Array.isArray(prev)?prev:[]).concat([histRecord]);});
    if(dbOK(p.dbStatus)){
      sbUpsert("harga_survei",[hargaToSB(updated)]).catch(function(){});
      sbInsert("harga_survei",[hargaToSB(histRecord)]).catch(function(){});
    }
    setEditItem(null);
  }

  function addHarga(){
    if(!newItem.nama||!newItem.harga){showToast("Nama dan harga wajib diisi!","error");return;}
    var sat=(newItem.satuan||"kg").toLowerCase().trim();
    // Cek duplikat nama+satuan yang sudah ada
    var existing=safeH.find(function(h){return h.nama.toLowerCase()===newItem.nama.toLowerCase()&&(h.satuan||"").toLowerCase().trim()===sat;});
    if(existing){showToast("Sudah ada harga untuk '"+newItem.nama+"' satuan '"+newItem.satuan+"'. Gunakan tombol edit ✏️","warn");return;}
    var item={id:uid(),nama:newItem.nama,satuan:newItem.satuan||"kg",harga:parseFloat(newItem.harga)||0,tanggal:today()};
    var histRec=Object.assign({},item,{id:uid()});
    p.setHargaList(function(prev){return (Array.isArray(prev)?prev:[]).concat([item]);});
    p.setHargaHistory(function(prev){return (Array.isArray(prev)?prev:[]).concat([histRec]);});
    if(dbOK(p.dbStatus)){
      sbInsert("harga_survei",[hargaToSB(item),hargaToSB(histRec)]).catch(function(){});
    }
    setNewItem({nama:"",satuan:"",harga:""});
    setShowAdd(false);
  }

  function delHarga(id){
    if(!window.confirm("Hapus data harga ini?")) return;
    p.setHargaList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(h){return h.id!==id;});});
    if(dbOK(p.dbStatus)) sbDelete("harga_survei",id).catch(function(){});
  }

  var is={width:"100%",border:"1px solid #e2e8f0",borderRadius:".5rem",padding:".45rem .75rem",fontSize:".8rem",fontFamily:"inherit"};

  return RC("div",{style:{display:"flex",flexDirection:"column",gap:".875rem"}},
    RC(PageHeader,{title:"Harga Bahan",sub:"Referensi & Riwayat Harga",
      action:RC(Btn,{onClick:function(){setShowAdd(true);},sm:true},"+ Tambah")}),

    // ── Banner anomali harga ──
    anomaliCount>0&&RC("div",{style:{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:".75rem",padding:".75rem 1rem"}},
      RC("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:".5rem"}},
        RC("div",null,
          RC("p",{style:{fontWeight:700,fontSize:".82rem",color:"#dc2626",margin:0}},
            "⚠️ "+anomaliCount+" komoditas mengalami perubahan harga signifikan (≥"+ANOMALI_THRESHOLD+"%)"
          ),
          RC("p",{style:{fontSize:".65rem",color:"#94a3b8",margin:"2px 0 0"}},"Dibandingkan harga 30 hari lalu")
        )
      ),
      RC("div",{style:{display:"flex",flexWrap:"wrap",gap:".375rem"}},
        Object.keys(anomali).map(function(nama){
          var a=anomali[nama];
          var naik=a.pct>0;
          return RC("div",{key:nama,style:{background:naik?"#fef2f2":"#f0fdf4",
            border:"1px solid "+(naik?"#fecaca":"#bbf7d0"),borderRadius:".5rem",

  dipesan:{bg:"#fff7ed",bd:"#fed7aa",tx:"#ea580c",dot:"#f59e0b"},
  dibayar:{bg:"#eff6ff",bd:"#bfdbfe",tx:"#2563eb",dot:"#3b82f6"},
  dikirim:{bg:"#f5f3ff",bd:"#ddd6fe",tx:"#7c3aed",dot:"#8b5cf6"},

function PagePesanan(p){
  var safeB=Array.isArray(p.belanjaList)?p.belanjaList:[];

  // Belanja diurutkan terbaru dulu
  var sortedB=useMemo(function(){
    return safeB.slice().sort(function(a,b){
      return (b.createdAt||b.tanggal||"").localeCompare(a.createdAt||a.tanggal||"");
    });
  },[safeB]);

  var s1=useState(null),selBelanjaId=s1[0],setSelBelanjaId=s1[1];
  var s2=useState(null),expandedItemId=s2[0],setExpandedItemId=s2[1];
  var s3=useState(""),catatan=s3[0],setCatatan=s3[1];
  var s4=useState("semua"),filterItemStatus=s4[0],setFilterItemStatus=s4[1];
  var s5=useState(false),showSelector=s5[0],setShowSelector=s5[1];
  var s6=useState(""),searchItem=s6[0],setSearchItem=s6[1];   // filter bahan
  var s7=useState(""),selectorSearch=s7[0],setSelectorSearch=s7[1]; // cari belanja di dropdown

  // Auto-select belanja terakhir saat pertama buka
  useEffect(function(){
    if(!selBelanjaId && sortedB.length>0){
      setSelBelanjaId(sortedB[0].id);
    }
  },[sortedB.length]);

  // Jika belanja yang dipilih dihapus, fallback ke terbaru
  useEffect(function(){
    if(selBelanjaId && !safeB.find(function(b){return b.id===selBelanjaId;})){
      setSelBelanjaId(sortedB.length>0?sortedB[0].id:null);
    }
  },[selBelanjaId,safeB.length]);

  var selBelanja=selBelanjaId?safeB.find(function(b){return b.id===selBelanjaId;}):null;
  var selSppg=selBelanja?(p.sppgList||[]).find(function(x){return x.id===selBelanja.sppgId;}):null;

  // Update status satu item
  function updateItemStatus(itemId,newStatus){
    if(!selBelanja) return;
    var cloudOK=dbOK(p.dbStatus);
    var logEntry={status:newStatus,waktu:new Date().toISOString(),catatan:catatan||""};
    var newItems=(selBelanja.items||[]).map(function(it){
      if(it.id!==itemId) return it;
      return Object.assign({},it,{status:newStatus,statusLog:((it.statusLog||[]).concat([logEntry]))});
    });
    var updated=Object.assign({},selBelanja,{items:newItems});
    p.setBelanjaList(function(prev){
      return (Array.isArray(prev)?prev:[]).map(function(b){return b.id===selBelanja.id?updated:b;});
    });
    if(cloudOK) sbUpsert("transaksi",[belanjaToTrx(updated)]).catch(function(e){console.warn(e);});
    setExpandedItemId(null);
    setCatatan("");
    showToast("Status "+ST_LABEL[newStatus]+" ✓","success");
  }

  // Update semua item sekaligus ke status tertentu
  function updateAllItems(newStatus){
    if(!selBelanja) return;
    if(!window.confirm("Update SEMUA bahan ke '"+ST_LABEL[newStatus]+"'?")) return;
    var cloudOK=dbOK(p.dbStatus);
    var logEntry={status:newStatus,waktu:new Date().toISOString(),catatan:"(bulk update)"};
    var newItems=(selBelanja.items||[]).map(function(it){
      var curSt=it.status||"belum_dipesan";
      var curIdx=ST_ORDER.indexOf(curSt);
      var newIdx=ST_ORDER.indexOf(newStatus);
      if(newIdx<=curIdx) return it; // jangan mundur
      return Object.assign({},it,{status:newStatus,statusLog:((it.statusLog||[]).concat([logEntry]))});
    });
    var updated=Object.assign({},selBelanja,{items:newItems});
    p.setBelanjaList(function(prev){
      return (Array.isArray(prev)?prev:[]).map(function(b){return b.id===selBelanja.id?updated:b;});
    });
    if(cloudOK) sbUpsert("transaksi",[belanjaToTrx(updated)]).catch(function(e){console.warn(e);});
    showToast("Semua bahan ditandai "+ST_LABEL[newStatus],"success");
  }

  // Hitung ringkasan status per item di belanja yang dipilih
  var ringkasanItem=useMemo(function(){
    var r={dipesan:0,dibayar:0,dikirim:0,sampai:0,dibatalkan:0};
    if(!selBelanja) return r;
    (selBelanja.items||[]).forEach(function(it){r[it.status||"belum_dipesan"]=(r[it.status||"belum_dipesan"]||0)+1;});
    return r;
  },[selBelanja]);

  // Filter items
  var filteredItems=useMemo(function(){
    if(!selBelanja) return [];
    return (selBelanja.items||[]).filter(function(it){
      if(filterItemStatus!=="semua"&&(it.status||"belum_dipesan")!==filterItemStatus) return false;
      if(searchItem){var sq=searchItem.toLowerCase();if((it.nama||"").toLowerCase().indexOf(sq)<0)return false;}
      return true;
    });
  },[selBelanja,filterItemStatus,searchItem]);

  var is={border:"1px solid #e2e8f0",borderRadius:".5rem",padding:"5px 10px",fontSize:".78rem",fontFamily:"inherit"};

  return RC("div",{style:{display:"flex",flexDirection:"column",gap:".875rem"}},
    RC(PageHeader,{title:"Track Pesanan",sub:"Status per bahan"}),

    // ── Selector belanja ──
    RC(Card,null,
      RC("div",{style:{marginBottom:".5rem",display:"flex",justifyContent:"space-between",alignItems:"center"}},
        RC("div",null,
          RC("p",{style:{fontSize:".62rem",fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:".04em",margin:0}},"Belanja yang dipantau"),
          RC("p",{style:{fontSize:".62rem",color:"#94a3b8",margin:"1px 0 0"}},"Otomatis: terakhir diinput")
        ),
        RC("button",{onClick:function(){setShowSelector(function(v){if(v)setSelectorSearch("");return !v;});},
          style:{background:showSelector?"#eff6ff":"#f1f5f9",border:"1px solid "+(showSelector?"#bfdbfe":"#e2e8f0"),
            borderRadius:".5rem",padding:"4px 12px",fontSize:".72rem",fontWeight:600,
            color:showSelector?"#2563eb":"#64748b",cursor:"pointer"}},
          showSelector?"✕ Tutup":"🔄 Ganti Belanja"
        )
      ),
      // Info belanja terpilih
      selBelanja
        ?RC("div",{style:{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:".625rem",padding:".625rem .875rem"}},
          RC("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:".375rem"}},
            RC("div",null,
              RC("p",{style:{fontWeight:700,fontSize:".85rem",color:"#1e293b",margin:0}},selBelanja.judul||"(tanpa judul)"),
              RC("p",{style:{fontSize:".65rem",color:"#94a3b8",margin:"2px 0 0"}},
                (selSppg?selSppg.nama:"—")+" · "+shortDate(selBelanja.tanggal)+" · "+(selBelanja.items||[]).length+" bahan"
              )
            ),
            RC("p",{style:{fontFamily:"monospace",fontWeight:800,fontSize:".9rem",color:"#2563eb",margin:0}},fmt(selBelanja.totalFinal||0))
          )
        )
        :RC("p",{style:{fontSize:".78rem",color:"#94a3b8",margin:0,textAlign:"center",padding:".5rem 0"}},"Belum ada data belanja"),

      // Dropdown selector dengan search
      showSelector&&RC("div",{style:{marginTop:".625rem",borderTop:"1px solid #f1f5f9",paddingTop:".625rem"}},
        RC("input",{style:{width:"100%",border:"1px solid #e2e8f0",borderRadius:".5rem",padding:"6px 10px",
          fontSize:".75rem",fontFamily:"inherit",marginBottom:".5rem"},
          placeholder:"🔍 Cari belanja...",
          value:selectorSearch,onChange:function(e){setSelectorSearch(e.target.value);}
        }),
        RC("div",{style:{maxHeight:"220px",overflowY:"auto",display:"flex",flexDirection:"column",gap:"4px"}},
        sortedB.filter(function(b){
          if(!selectorSearch) return true;
          var sq=selectorSearch.toLowerCase();
          return (b.judul||"").toLowerCase().indexOf(sq)>=0
            || (b.tanggal||"").indexOf(sq)>=0
            || (b.items||[]).some(function(it){return (it.nama||"").toLowerCase().indexOf(sq)>=0;});

        }).map(function(b,i){
          var sp2=(p.sppgList||[]).find(function(x){return x.id===b.sppgId;});
          var isSelected=b.id===selBelanjaId;
          return RC("button",{key:b.id,
            onClick:function(){setSelBelanjaId(b.id);setShowSelector(false);setSelectorSearch("");setExpandedItemId(null);setFilterItemStatus("semua");setSearchItem("");},
            style:{display:"flex",justifyContent:"space-between",alignItems:"center",
              background:isSelected?"#eff6ff":"white",border:"1px solid "+(isSelected?"#bfdbfe":"#f1f5f9"),
              borderRadius:".5rem",padding:".5rem .75rem",cursor:"pointer",textAlign:"left",width:"100%",
              fontFamily:"inherit"}},
            RC("div",{style:{flex:1,minWidth:0}},
              RC("p",{style:{fontWeight:600,fontSize:".78rem",color:"#1e293b",margin:0,
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},
                (i===0?"🕐 ":"")+( b.judul||"(tanpa judul)")
              ),
              RC("p",{style:{fontSize:".62rem",color:"#94a3b8",margin:0}},(sp2?sp2.nama:"—")+" · "+shortDate(b.tanggal))
            ),
            RC("span",{style:{fontSize:".72rem",fontFamily:"monospace",color:"#2563eb",fontWeight:700,flexShrink:0,marginLeft:".5rem"}},fmtS(b.totalFinal||0))
          );
        })
        ) // close inner scroll div
      ) // close outer wrapper div
    ),

    // ── Ringkasan status item + filter ──
    selBelanja&&RC("div",{style:{display:"flex",flexDirection:"column",gap:".375rem"}},
      RC("div",{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:".375rem"}},
        ST_ORDER.map(function(st){
          var c=ST_COLOR[st];
          var n=ringkasanItem[st]||0;
          var isActive=filterItemStatus===st;
          return RC("div",{key:st,onClick:function(){setFilterItemStatus(isActive?"semua":st);},
            style:{background:isActive?c.bg:"white",
              border:"2px solid "+(isActive?c.dot:"#e2e8f0"),
              borderRadius:".625rem",padding:".5rem",textAlign:"center",cursor:"pointer",
              opacity:n===0?.4:1,transition:"all .12s"}},
            RC("div",{style:{fontSize:"1.05rem",fontWeight:800,color:isActive?c.tx:"#1e293b"}},n),
            RC("div",{style:{fontSize:".58rem",fontWeight:600,color:isActive?c.tx:"#64748b",textTransform:"uppercase"}},ST_LABEL[st])
          );
        })
      ),
      filterItemStatus!=="semua"&&RC("div",{style:{textAlign:"right"}},
        RC("button",{onClick:function(){setFilterItemStatus("semua");},
          style:{background:"none",border:"none",fontSize:".68rem",color:"#94a3b8",cursor:"pointer",padding:"0 2px"}},
          "✕ Hapus filter"
        )
      )
    ),

    // ── Bulk update + search ──
    selBelanja&&RC(Card,{style:{padding:".625rem .875rem"}},
      RC("div",{style:{display:"flex",gap:".375rem",flexWrap:"wrap",alignItems:"center"}},
        RC("input",{style:Object.assign({},is,{flex:1,minWidth:"120px"}),
          placeholder:"🔍 Cari nama bahan...",value:searchItem,
          onChange:function(e){setSearchItem(e.target.value);}}),
        RC("span",{style:{fontSize:".65rem",color:"#94a3b8",padding:"0 4px"}},"Tandai semua:"),
        ST_ORDER.slice(1).map(function(st){
          var c=ST_COLOR[st];
          return RC("button",{key:st,onClick:function(){updateAllItems(st);},
            style:{background:c.bg,color:c.tx,border:"1px solid "+c.bd,
              borderRadius:".5rem",padding:"3px 10px",fontSize:".68rem",fontWeight:700,cursor:"pointer",whiteSpace:"nowrap"}},
            ST_LABEL[st]
          );
        })
      )
    ),

    // ── Daftar item/bahan ──
    !selBelanja&&RC(EmptyState,{icon:"📦",title:"Pilih data belanja di atas",sub:"Otomatis memilih belanja terakhir diinput"}),

    selBelanja&&filteredItems.length===0&&RC(EmptyState,{icon:"🔍",title:"Tidak ada bahan",sub:"Coba ubah filter status"}),

    selBelanja&&filteredItems.length>0&&RC("div",{style:{display:"flex",flexDirection:"column",gap:".5rem"}},
      filteredItems.map(function(it){
        var itSt=it.status||"belum_dipesan";
        var c=ST_COLOR[itSt]||ST_COLOR.dipesan;
        var curIdx=ST_ORDER.indexOf(itSt);
        var nextSt=curIdx>=0&&curIdx<ST_ORDER.length-1?ST_ORDER[curIdx+1]:null;
        var prevSt=curIdx>0?ST_ORDER[curIdx-1]:null;
        var isBatal=itSt==="dibatalkan";
        var isDone=itSt==="sampai";
        // Untuk dibatalkan: cari status terakhir sebelum dibatalkan dari log
        var revertToBatal=(function(){
          if(!isBatal) return null;
          var logs=it.statusLog||[];
          for(var li=logs.length-1;li>=0;li--){
            if(logs[li].status!=="dibatalkan") return logs[li].status;
          }
          return "belum_dipesan";
        })();
        var isExpanded=expandedItemId===it.id;

        // Cek lambat: sudah >2 hari sejak update terakhir dan belum selesai
        var isLambat=(function(){
          if(isDone||isBatal) return false;
          var lastLog=(it.statusLog||[]).slice(-1)[0];
          var refTime=lastLog?new Date(lastLog.waktu).getTime():new Date(selBelanja.tanggal||"").getTime();
          return (Date.now()-refTime)>2*24*60*60*1000;
        })();

// ─── ERROR BOUNDARY ──────────────────────────────────────────────────────────
class ErrorBoundary extends React.Component {
  constructor(props){super(props);this.state={err:null};}
  static getDerivedStateFromError(e){return {err:e};}
  componentDidCatch(e,info){console.error("ErrorBoundary:",e,info);}
  render(){
    if(this.state.err){
      return RC("div",{style:{padding:"2rem",textAlign:"center",color:"#dc2626"}},
        RC("div",{style:{fontSize:"2rem",marginBottom:"1rem"}},"⚠️"),
        RC("p",{style:{fontWeight:700,fontSize:"1rem"}},"Terjadi error"),
        RC("p",{style:{fontSize:".8rem",color:"#64748b",marginBottom:"1rem"}},this.state.err.message),
        RC("button",{onClick:function(){window.location.reload();},
          style:{background:"#2563eb",color:"white",border:"none",padding:"8px 20px",borderRadius:"8px",cursor:"pointer",fontWeight:600}},"Muat Ulang")
      );
    }
    return this.props.children;
  }
}

// ─── APP ──────────────────────────────────────────────────────────────────────
function App(){
  var s1=useState("dashboard"),tab=s1[0],setTab=s1[1];
  var s2=useLS("mbg_sppg",[]),sppgList=s2[0],setSppgList=s2[1];
  var s3=useLS("mbg_belanja_v2",[]),belanjaList=s3[0],setBelanjaList=s3[1];
  var s4=useLS("mbg_operasional",[]),operasionalList=s4[0],setOperasionalList=s4[1];
  var s5=useLS("mbg_hargadb",HARGA0),hargaList=s5[0],setHargaList=s5[1];
  var s6=useLS("mbg_harga_history",[]),hargaHistory=s6[0],setHargaHistory=s6[1];
  var s7=useState(null),modal=s7[0],setModal=s7[1];
  var s8=useState(false),collapsed=s8[0],setCollapsed=s8[1];
  var s9=useState("connecting"),dbStatus=s9[0],setDbStatus=s9[1];
  var s10=useState(false),loading=s10[0],setLoading=s10[1];
  var s11=useState(""),syncMsg=s11[0],setSyncMsg=s11[1];
  var s12=useState(false),showSbModal=s12[0],setShowSbModal=s12[1];

  var safeSppg=Array.isArray(sppgList)?sppgList:[];

  // ── Auto-connect on first load ──
  useEffect(function(){
    var ctrl=new AbortController();
    var timer=setTimeout(function(){ctrl.abort();},8000);
    setLoading(true);
    // Saat app buka: rebuild harga dari data lokal dulu (supaya chart langsung bisa)
    setBelanjaList(function(prevB){
      setHargaList(function(prevH){
        setHargaHistory(function(prevHist){
          var hd=buildHargaData(Array.isArray(prevB)?prevB:[],Array.isArray(prevHist)?prevHist:[]);
          // Hanya update jika history lokal lebih lengkap dari yang tersimpan
          if(hd.history.length > (Array.isArray(prevHist)?prevHist:[]).length){
            setTimeout(function(){setHargaHistory(hd.history);setHargaList(hd.current);},0);
          }
          return prevHist;
        });
        return prevH;
      });
      return prevB;
    });
    fetch(SB_URL+"/rest/v1/sppg?select=id&limit=1",{headers:SBH,signal:ctrl.signal})
      .then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status);
        return Promise.all([
          sbGet("sppg"),
          sbGet("transaksi","komponen=eq.bahan_baku"),
          sbGet("harga_survei")
        ]);
      })
      .then(function(res){
        clearTimeout(timer);
        var bList=Array.isArray(res[1])&&res[1].length>0 ? res[1].map(trxToBelanja) : null;
        var hSurvei=Array.isArray(res[2]) ? res[2].map(sbToHarga) : [];
        if(Array.isArray(res[0])&&res[0].length>0) setSppgList(res[0].map(sbToSppg));
        if(bList) setBelanjaList(bList);
        var hd=buildHargaData(bList||[],hSurvei);
        setHargaList(hd.current);
        setHargaHistory(hd.history);
        setDbStatus("online");
      })
      .catch(function(){ setDbStatus("local"); })
      .finally(function(){ setLoading(false); clearTimeout(timer); });
    return function(){ clearTimeout(timer); ctrl.abort(); };
  },[]);

  // ── Auto-refresh every 30s ──
  useEffect(function(){
    if(dbStatus!=="online") return;
    var iv=setInterval(function(){
      Promise.all([
        sbGet("sppg"),
        sbGet("transaksi","komponen=eq.bahan_baku"),
        sbGet("harga_survei")
      ]).then(function(res){
        var bList=Array.isArray(res[1])&&res[1].length>0 ? res[1].map(trxToBelanja) : null;
        var hSurvei=Array.isArray(res[2]) ? res[2].map(sbToHarga) : [];
        if(Array.isArray(res[0])&&res[0].length>0) setSppgList(res[0].map(sbToSppg));
        if(bList) setBelanjaList(bList);
        // Rebuild harga dari data terbaru — satu kali, bersih
        var hd=buildHargaData(bList||[],hSurvei);
        setHargaList(hd.current);
        setHargaHistory(hd.history);
      }).catch(function(){});
    },30000);
    return function(){ clearInterval(iv); };
  },[dbStatus]);

  // ── Supabase Realtime subscription ──
  useEffect(function(){
    if(dbStatus!=="online" && dbStatus!=="realtime") return;
    var client=getSBClient();
    if(!client) return;

    var channel=client.channel("mbg-live-"+Date.now())
      // ── transaksi (belanja + operasional) ──
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"transaksi"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        if(row.komponen==="bahan_baku"){
          setBelanjaList(function(prev){
            var list=Array.isArray(prev)?prev:[];
            if(list.some(function(b){return b.id===row.id;})) return list; // já existe
            return list.concat([trxToBelanja(row)]);
          });
        } else if(row.komponen==="operasional"){
          setOperasionalList(function(prev){
            var list=Array.isArray(prev)?prev:[];
            if(list.some(function(o){return o.id===row.id;})) return list;
            return list.concat([trxToOp(row)]);
          });
        }
      })
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"transaksi"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        if(row.komponen==="bahan_baku"){
          setBelanjaList(function(prev){
            return (Array.isArray(prev)?prev:[]).map(function(b){return b.id===row.id?trxToBelanja(row):b;});
          });
        } else if(row.komponen==="operasional"){
          setOperasionalList(function(prev){
            return (Array.isArray(prev)?prev:[]).map(function(o){return o.id===row.id?trxToOp(row):o;});
          });
        }
      })
      .on("postgres_changes",{event:"DELETE",schema:"public",table:"transaksi"},function(payload){
        var id=payload.old&&payload.old.id; if(!id) return;
        setBelanjaList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(b){return b.id!==id;});});
        setOperasionalList(function(prev){return (Array.isArray(prev)?prev:[]).filter(function(o){return o.id!==id;});});
      })
      // ── sppg ──
      .on("postgres_changes",{event:"*",schema:"public",table:"sppg"},function(){
        sbGet("sppg").then(function(rows){
          if(Array.isArray(rows)&&rows.length>0) setSppgList(rows.map(sbToSppg));
        }).catch(function(){});
      })
      // ── harga_survei ──
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"harga_survei"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        var hItem=sbToHarga(row);
        // Tambah ke history
        setHargaHistory(function(prev){
          var list=Array.isArray(prev)?prev:[];
          if(list.some(function(h){return h.id===row.id;})) return list;
          return list.concat([hItem]);
        });
        // Update hargaList: JAGA ID asli — hanya update harga/satuan/tanggal
        setHargaList(function(prev){
          var list=Array.isArray(prev)?prev:[];
          var ex=list.find(function(h){return h.nama===hItem.nama;});
          if(!ex) return list.concat([hItem]);
          // Hanya update nilai, bukan ganti seluruh object (pertahankan ID asli)
          if(hItem.tanggal>=(ex.tanggal||"")){
            return list.map(function(h){
              return h.nama===hItem.nama
                ? Object.assign({},h,{harga:hItem.harga,satuan:hItem.satuan,tanggal:hItem.tanggal})
                : h;
            });
          }
          return list;
        });
      })
      .on("postgres_changes",{event:"UPDATE",schema:"public",table:"harga_survei"},function(payload){
        var row=payload.new; if(!row||!row.id) return;
        var hItem=sbToHarga(row);
        setHargaHistory(function(prev){
          return (Array.isArray(prev)?prev:[]).map(function(h){return h.id===row.id?hItem:h;});
        });
        setHargaList(function(prev){
          return (Array.isArray(prev)?prev:[]).map(function(h){return h.id===row.id?hItem:h;});
        });
      })
      .subscribe(function(status,err){
        if(status==="SUBSCRIBED"){
          setDbStatus("realtime");
        } else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){
          setDbStatus("online"); // fallback ke polling
          console.warn("Realtime channel error:",err);
        }
      });

    return function(){ client.removeChannel(channel); };
  },[dbStatus]);

  function syncFromSB(){
    setSyncMsg("Mengambil data dari Supabase...");
    Promise.all([sbGet("sppg"),sbGet("transaksi","komponen=eq.bahan_baku"),sbGet("harga_survei")])
      .then(function(res){
        var bList=Array.isArray(res[1])&&res[1].length>0 ? res[1].map(trxToBelanja) : null;
        var hSurvei=Array.isArray(res[2]) ? res[2].map(sbToHarga) : [];
        if(Array.isArray(res[0])&&res[0].length>0) setSppgList(res[0].map(sbToSppg));
        if(bList) setBelanjaList(bList);
        var hd=buildHargaData(bList||[],hSurvei);
        setHargaList(hd.current);
        setHargaHistory(hd.history);
        setSyncMsg("✅ Berhasil disinkronkan!");
        setDbStatus("online");
        setTimeout(function(){setSyncMsg("");},2500);
      })
      .catch(function(e){ setSyncMsg("❌ Gagal: "+e.message); setDbStatus("local"); });
  }
  function pushToSB(){
    setSyncMsg("Mengirim ke Supabase...");
    var sppgRows=safeSppg.map(sppgToSB);
    var trxB=(Array.isArray(belanjaList)?belanjaList:[]).map(belanjaToTrx);
    var trxO=(Array.isArray(operasionalList)?operasionalList:[]).map(opToTrx);
    var hRows=(Array.isArray(hargaList)?hargaList:[]).map(hargaToSB);
    // Push history harga eksplisit (bukan yang dihasilkan dari belanja — ID-nya mulai "blj_")
    var hHistRows=(Array.isArray(hargaHistory)?hargaHistory:[])
      .filter(function(h){return h.id&&!h.id.startsWith("blj_");})
      .map(hargaToSB);
    Promise.all([
      sppgRows.length?sbUpsert("sppg",sppgRows):Promise.resolve(),
      trxB.length?sbUpsert("transaksi",trxB):Promise.resolve(),
      trxO.length?sbUpsert("transaksi",trxO):Promise.resolve(),
      hRows.length?sbUpsert("harga_survei",hRows):Promise.resolve(),
      hHistRows.length?sbUpsert("harga_survei",hHistRows):Promise.resolve()
    ]).then(function(){
      setSyncMsg("✅ Berhasil dikirim!");
      setTimeout(function(){setSyncMsg("");},2500);
    }).catch(function(e){ setSyncMsg("❌ Push gagal: "+e.message); });
  }

  function backupJSON(){
    var data={sppg:sppgList,belanja:belanjaList,operasional:operasionalList,harga:hargaList,hargaHistory:hargaHistory,ts:new Date().toISOString()};
    var blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");a.href=url;a.download="MBG_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();
    showToast("Backup berhasil didownload","success");
  }
  function restoreJSON(file){
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var d=JSON.parse(e.target.result);
        if(d.belanja&&window.confirm("Restore akan mengganti semua data lokal. Lanjutkan?")){
          if(d.sppg) setSppgList(d.sppg);
          if(d.belanja) setBelanjaList(d.belanja);
          if(d.operasional) setOperasionalList(d.operasional);
          if(d.harga) setHargaList(d.harga);
          if(d.hargaHistory) setHargaHistory(d.hargaHistory);
          showToast("Restore berhasil!","success");
        }
      }catch(ex){showToast("File tidak valid: "+ex.message,"error");}
    };
    reader.readAsText(file);
  }

  function addSppg(s){
    setSppgList(function(prev){return (Array.isArray(prev)?prev:[]).concat([s]);});
    if(dbOK(dbStatus)) sbUpsert("sppg",[sppgToSB(s)]).catch(function(){});
  }

  var NAV=[
    {id:"dashboard",icon:"🏠",label:"Home"},
    {id:"belanja",icon:"🛒",label:"Belanja"},
    {id:"harga",icon:"💹",label:"Harga"},
    {id:"pesanan",icon:"📦",label:"Pesanan"},
  ];

  function renderPage(){
    if(tab==="dashboard") return RC(PageDashboard,{sppgList:safeSppg,belanjaList:belanjaList,hargaHistory:hargaHistory,setModal:setModal,setTab:setTab});
    if(tab==="belanja") return RC(PageBelanja,{sppgList:safeSppg,belanjaList:belanjaList,setBelanjaList:setBelanjaList,hargaDB:hargaList,setHargaList:setHargaList,setHargaHistory:setHargaHistory,dbStatus:dbStatus});
    if(tab==="harga") return RC(PageHarga,{hargaList:hargaList,setHargaList:setHargaList,hargaHistory:hargaHistory,setHargaHistory:setHargaHistory,dbStatus:dbStatus});
    if(tab==="pesanan") return RC(PagePesanan,{belanjaList:belanjaList,setBelanjaList:setBelanjaList,sppgList:safeSppg,dbStatus:dbStatus});
    return null;
  }

  var stC={online:"#4ade80",realtime:"#34d399",connecting:"#60a5fa",error:"#f87171",local:"#f87171",idle:"#f87171"};
  var stL={online:"Live",realtime:"⚡ Realtime",connecting:"...",error:"Offline",local:"Offline",idle:"Offline"};

  return RC("div",{className:"app-shell"},
    // TOPBAR
    RC("div",{className:"topbar"},
      RC("div",{style:{display:"flex",alignItems:"center",gap:".75rem"}},
        RC("button",{onClick:function(){setCollapsed(function(c){return !c;});},style:{background:"rgba(255,255,255,.15)",border:"none",borderRadius:".5rem",width:"2rem",height:"2rem",cursor:"pointer",color:"white",fontSize:"1.1rem",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}},
          collapsed?"☰":"✕"
        ),
        RC("div",{style:{width:"2rem",height:"2rem",background:"rgba(255,255,255,.2)",borderRadius:".5rem",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"1.1rem"}},"🍱"),
        RC("div",null,
          RC("p",{style:{fontWeight:"bold",fontSize:".875rem",margin:0}},"PantauBelanjaMBG"),
          RC("p",{style:{fontSize:".65rem",opacity:.75,margin:0}},"SPPG Citeureup")
        )
      ),
      RC("div",{style:{display:"flex",alignItems:"center",gap:".5rem"}},
        RC("span",{style:{fontSize:".7rem",opacity:.8}},safeSppg.length+" SPPG"),
        RC("button",{onClick:function(){setShowSbModal(true);},style:{background:"rgba(255,255,255,.15)",border:"none",borderRadius:"20px",padding:"3px 10px",cursor:"pointer",fontSize:".7rem",color:"white",display:"flex",alignItems:"center",gap:"4px"}},
          RC("span",{className:"status-dot",style:{background:stC[dbStatus]||"#94a3b8"}}),
          stL[dbStatus]||"—"
        )
      )
    ),

    // Loading overlay
    loading&&RC("div",{style:{position:"fixed",inset:0,background:"rgba(255,255,255,.92)",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:"1rem"}},
      RC("div",{style:{width:"2.5rem",height:"2.5rem",border:"4px solid #3b82f6",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 1s linear infinite"}}),
      RC("p",{style:{fontSize:".875rem",color:"#4b5563",fontWeight:500,margin:0}},"Memuat data..."),
      RC("p",{style:{fontSize:".75rem",color:"#9ca3af",margin:0}},"Menghubungkan ke Supabase")
    ),

    // CONTENT
    RC("div",{className:"content-area"+(collapsed?" collapsed":"")},
      RC("aside",{className:"sidebar"},
        NAV.map(function(n){
          return RC("button",{key:n.id,className:"sidebar-btn"+(tab===n.id?" active":""),onClick:function(){setTab(n.id);},title:n.label},
            RC("span",{className:"si"},n.icon),
            RC("span",{className:"sidebar-label"},n.label)
          );
        }),
        RC("div",{className:"sidebar-note",style:{marginTop:"auto",padding:".625rem",background:"#f8fafc",borderRadius:".5rem",fontSize:".65rem",color:"#94a3b8",lineHeight:1.5}},
          dbStatus==="realtime"?"⚡ Realtime aktif — data sync otomatis":
          dbStatus==="online"?"☁️ Tersambung ke Supabase":
          dbStatus==="connecting"?"🔄 Menghubungkan ke Supabase...":"🔴 Offline — data tidak tersimpan ke cloud"
        )
      ),
      RC("main",{className:"page-content"},renderPage())
    ),

    // BOTTOM NAV (mobile)
    RC("nav",{className:"bottom-nav",style:{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:"900px",background:"white",borderTop:"1px solid #f3f4f6",display:"flex",zIndex:100,boxShadow:"0 -1px 3px rgba(0,0,0,.1)"}},
      NAV.map(function(n){
        return RC("button",{key:n.id,onClick:function(){setTab(n.id);},style:{flex:1,padding:".55rem 0",display:"flex",flexDirection:"column",alignItems:"center",gap:".125rem",border:"none",background:"none",cursor:"pointer",color:tab===n.id?"#2563eb":"#9ca3af",minWidth:0}},
          RC("span",{style:{fontSize:"clamp(.9rem,2.5vw,1.1rem)",lineHeight:1}},n.icon),
          RC("span",{style:{fontSize:"clamp(.48rem,1.6vw,.65rem)",fontWeight:500,whiteSpace:"nowrap"}},n.label)
        );
      })
    ),

    // MODALS
    modal==="sppg"&&RC(ModalSPPG,{onSave:function(s){addSppg(s);setModal(null);},onClose:function(){setModal(null);}}),

    // SUPABASE MODAL
    showSbModal&&RC("div",{className:"sb-modal",onClick:function(e){if(e.target===e.currentTarget)setShowSbModal(false);}},
      RC("div",{className:"sb-inner"},
        RC("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"1rem"}},
          RC("p",{style:{fontWeight:700,fontSize:".95rem",margin:0}},"Koneksi Database"),
          RC("button",{onClick:function(){setShowSbModal(false);},style:{background:"none",border:"none",cursor:"pointer",color:"#94a3b8",fontSize:"1.5rem",lineHeight:1}},"×")
        ),
        RC("div",{style:{background:"#f8fafc",borderRadius:".625rem",padding:".875rem",marginBottom:"1rem"}},
          RC("div",{style:{display:"flex",alignItems:"center",gap:".625rem",marginBottom:".375rem"}},
            RC("span",{className:"status-dot",style:{width:"10px",height:"10px",background:stC[dbStatus]||"#94a3b8"}}),
            RC("span",{style:{fontWeight:700,fontSize:".85rem",color:"#1e293b"}},
              dbStatus==="realtime"?"⚡ Realtime Aktif":
              dbStatus==="online"?"✅ Terhubung ke Supabase":
              dbStatus==="connecting"?"🔄 Menghubungkan...":"🔴 Tidak terkoneksi — data hanya lokal"
            )
          ),
          RC("p",{style:{fontSize:".7rem",color:"#64748b",margin:0}},SB_URL.replace("https://","")),
          RC("p",{style:{fontSize:".68rem",color:"#94a3b8",margin:"4px 0 0"}},
            dbStatus==="realtime"
              ?"⚡ Realtime WebSocket aktif — perubahan data langsung terlihat di semua perangkat tanpa refresh."
              :"Data tersimpan di cloud & lokal. Sync otomatis setiap 30 detik (polling). Realtime akan aktif otomatis saat koneksi tersedia."
          )
        ),
        syncMsg&&RC("div",{style:{padding:"8px 12px",borderRadius:".625rem",background:syncMsg.indexOf("❌")>=0?"#fef2f2":"#f0fdf4",color:syncMsg.indexOf("❌")>=0?"#dc2626":"#059669",fontSize:".78rem",fontWeight:600,marginBottom:".75rem"}},syncMsg),
        RC("div",{style:{display:"flex",gap:".5rem"}},
          RC("button",{onClick:syncFromSB,style:{flex:1,background:"#059669",color:"white",border:"none",borderRadius:".5rem",padding:".65rem",fontSize:".82rem",fontWeight:600,cursor:"pointer"}},"⬇ Ambil dari Cloud"),
          RC("button",{onClick:pushToSB,style:{flex:1,background:"#7c3aed",color:"white",border:"none",borderRadius:".5rem",padding:".65rem",fontSize:".82rem",fontWeight:600,cursor:"pointer"}},"⬆ Kirim ke Cloud")
        ),
        RC("p",{style:{fontSize:".65rem",color:"#94a3b8",marginTop:".625rem",textAlign:"center"}},"Ambil: tarik data terbaru. Kirim: dorong data lokal ke cloud."),
        RC("hr",{style:{border:"none",borderTop:"1px solid #f1f5f9",margin:".75rem 0"}}),
        RC("p",{style:{fontSize:".72rem",fontWeight:700,color:"#475569",margin:"0 0 .5rem"}},"💾 Backup & Restore"),
        RC("div",{style:{display:"flex",gap:".5rem",flexWrap:"wrap"}},
          RC("button",{onClick:backupJSON,style:{flex:1,background:"#2563eb",color:"white",border:"none",borderRadius:".5rem",padding:".5rem",fontSize:".78rem",fontWeight:600,cursor:"pointer"}},"⬇ Backup JSON"),
          RC("label",{style:{flex:1,background:"#ea580c",color:"white",border:"none",borderRadius:".5rem",padding:".5rem",fontSize:".78rem",fontWeight:600,cursor:"pointer",textAlign:"center"}},
            "⬆ Restore JSON",
            RC("input",{type:"file",accept:".json",style:{display:"none"},onChange:function(e){if(e.target.files&&e.target.files[0])restoreJSON(e.target.files[0]);}})
          )
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(RC(ErrorBoundary,null,RC(App,null)));
</script>
</body>
